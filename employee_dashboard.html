<script>
async function loadPeople() {
    const container = document.getElementById("users-list");
    const countElement = document.getElementById("users-count");

    if (!container) return;

    container.innerHTML = `
        <div class="loading">
            در حال دریافت کاربران...
        </div>
    `;

    const { data, error } =
        await supabaseClient.functions.invoke("manage-users", {
            body: {
                action: "list"
            }
        });

    if (error) {
        console.error(error);

        container.innerHTML = `
            <div class="empty-state">
                دریافت کاربران انجام نشد.
            </div>
        `;

        return;
    }

    if (!data?.success) {
        container.innerHTML = `
            <div class="empty-state">
                ${data?.error || "دریافت کاربران انجام نشد."}
            </div>
        `;

        return;
    }

    const users = Array.isArray(data.users)
        ? data.users
        : [];

    if (countElement) {
        countElement.textContent =
            `تعداد نفرات: ${users.length}`;
    }

    if (users.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                هیچ کاربری وجود ندارد.
            </div>
        `;

        return;
    }

    container.innerHTML = users.map((user) => {

        const fullName =
            [
                user.first_name,
                user.last_name
            ]
            .filter(Boolean)
            .join(" ")
            .trim() || "کاربر بدون نام";

        const phone =
            user.phone || "ثبت نشده";

        const email =
            user.email || "ثبت نشده";

        const userId =
            String(user.id || "");

        return `
            <div class="person-card">

                <div class="person-info">

                    <div class="person-name">
                        ${escapeHtml(fullName)}
                    </div>

                    <div class="person-row">
                        <span>📱</span>
                        <span>${escapeHtml(phone)}</span>
                    </div>

                    <div class="person-row">
                        <span>✉️</span>
                        <span>${escapeHtml(email)}</span>
                    </div>

                    <div class="person-row">
                        <span>🔐</span>
                        <span>••••••••</span>
                    </div>

                </div>

                <button
                    type="button"
                    class="delete-user-btn"
                    data-user-id="${escapeHtml(userId)}"
                    onclick="deleteUserAccount(this.dataset.userId)"
                >
                    حذف
                </button>

            </div>
        `;
    }).join("");
}


async function deleteUserAccount(userId) {

    userId = String(userId || "").trim();

    if (!userId) {
        alert("شناسه کاربر مشخص نیست.");
        return;
    }

    const confirmed =
        confirm("این حساب کاربری حذف شود؟");

    if (!confirmed) {
        return;
    }

    const buttons =
        document.querySelectorAll(
            ".delete-user-btn"
        );

    buttons.forEach(button => {
        if (
            button.dataset.userId === userId
        ) {
            button.disabled = true;
            button.textContent = "در حال حذف...";
        }
    });

    const { data, error } =
        await supabaseClient.functions.invoke(
            "manage-users",
            {
                body: {
                    action: "delete",
                    user_id: userId
                }
            }
        );

    if (error) {
        console.error(error);

        alert(
            "حذف انجام نشد."
        );

        await loadPeople();
        return;
    }

    if (!data?.success) {
        alert(
            data?.error ||
            "حذف انجام نشد."
        );

        await loadPeople();
        return;
    }

    await loadPeople();
}


function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
