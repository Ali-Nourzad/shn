<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل کارمند | س.ح.ن</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, rgba(255, 183, 0, .16), transparent 35%),
                linear-gradient(135deg, #fffaf0, #f5eee1);
            color: #29231d;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 76px;
            padding: 0 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255, 255, 255, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid rgba(70, 50, 30, .08);
            box-shadow: 0 8px 30px rgba(80, 50, 20, .06);
        }

        .brand {
            font-size: 25px;
            font-weight: 900;
            color: #29231d;
            letter-spacing: -.5px;
        }

        .menu-button {
            width: 46px;
            height: 46px;

            border: none;
            border-radius: 14px;

            background: #2c2926;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;

            transition: .2s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            background: #1f1d1b;
        }

        .menu-button span {
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            display: block;
        }

        /* ================= MENU ================= */

        .dropdown {
            position: fixed;
            top: 86px;
            left: 25px;

            width: 230px;

            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(50, 40, 30, .08);
            border-radius: 18px;

            padding: 8px;

            box-shadow: 0 18px 50px rgba(50, 35, 20, .14);

            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);

            transition: .2s ease;

            z-index: 999;
        }

        .dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown button {
            width: 100%;
            border: none;
            background: transparent;

            padding: 13px 14px;

            border-radius: 12px;

            text-align: right;
            font-size: 14px;
            color: #39332d;

            transition: .18s ease;
        }

        .dropdown button:hover {
            background: #f6efe5;
        }

        /* ================= HOME ================= */

        .home {
            min-height: calc(100vh - 76px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }

        .home-title {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .home-subtitle {
            color: #85796d;
            font-size: 15px;
            margin-bottom: 42px;
        }

        .home-cards {
            width: min(800px, 100%);

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .home-card {
            min-height: 190px;

            border: 1px solid rgba(70, 50, 30, .08);
            border-radius: 25px;

            background: rgba(255, 255, 255, .68);
            backdrop-filter: blur(15px);

            box-shadow: 0 15px 40px rgba(80, 50, 20, .07);

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 13px;

            transition: .25s ease;
        }

        .home-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(80, 50, 20, .11);
        }

        .home-card-icon {
            font-size: 38px;
        }

        .home-card-title {
            font-size: 19px;
            font-weight: 800;
        }

        /* ================= PANEL ================= */

        .panel-page {
            display: none;
            min-height: calc(100vh - 76px);
        }

        .panel-page.active {
            display: flex;
        }

        .sidebar {
            width: 230px;
            min-width: 230px;

            background: rgba(255, 255, 255, .58);
            border-left: 1px solid rgba(60, 40, 20, .08);

            padding: 25px 15px;
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: 900;

            padding: 10px 12px 17px;

            color: #51473d;
        }

        .side-button {
            width: 100%;

            border: none;
            background: transparent;

            padding: 13px 14px;
            border-radius: 13px;

            text-align: right;

            color: #64594e;
            font-size: 14px;

            transition: .18s ease;
        }

        .side-button:hover,
        .side-button.active {
            background: rgba(255, 179, 0, .14);
            color: #9a6800;
        }

        .content {
            flex: 1;
            padding: 42px;
        }

        .content-title {
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .content-description {
            color: #8a7d70;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* ================= USERS ================= */

        .users-box {
            width: 100%;
            max-width: 950px;

            background: rgba(255, 255, 255, .68);

            border: 1px solid rgba(70, 50, 30, .08);
            border-radius: 22px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(80, 50, 20, .06);
        }

        .users-header {
            padding: 17px 20px;

            border-bottom: 1px solid rgba(60, 40, 20, .07);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .users-count {
            color: #8a7d70;
            font-size: 13px;
        }

        .user-row {
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            border-bottom: 1px solid rgba(60, 40, 20, .07);
        }

        .user-row:last-child {
            border-bottom: none;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .user-details {
            display: flex;
            flex-wrap: wrap;
            gap: 9px 25px;

            color: #776b60;
            font-size: 12px;
        }

        .user-details span {
            color: #a09284;
        }

        .delete-user-btn {
            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            padding: 10px 17px;

            background: #d94b43;
            color: white;

            font-size: 12px;

            transition: .18s ease;
        }

        .delete-user-btn:hover {
            background: #bf3932;
        }

        .delete-user-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        /* ================= EMPLOYEE CODES ================= */

        .codes-box {
            max-width: 700px;
        }

        .add-code {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-code input {
            flex: 1;

            border: 1px solid #ded3c5;
            background: rgba(255,255,255,.8);

            border-radius: 12px;

            padding: 13px 14px;
            outline: none;
        }

        .add-code input:focus {
            border-color: #d89b18;
        }

        .add-code button {
            border: none;
            border-radius: 12px;

            padding: 0 20px;

            background: #2c2926;
            color: white;
        }

        .code-row {
            padding: 15px 17px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,.68);

            border: 1px solid rgba(60,40,20,.07);
            border-radius: 14px;

            margin-bottom: 10px;
        }

        .code-value {
            direction: ltr;
            text-align: left;
            font-family: monospace;
        }

        .delete-code {
            border: none;
            background: #d94b43;
            color: white;

            padding: 8px 13px;
            border-radius: 9px;
            font-size: 12px;
        }

        /* ================= STATES ================= */

        .loading,
        .empty-state {
            padding: 35px;
            text-align: center;
            color: #8b7e71;
            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 17px;
                height: 68px;
            }

            .brand {
                font-size: 21px;
            }

            .home {
                min-height: calc(100vh - 68px);
            }

            .home-title {
                font-size: 27px;
            }

            .home-cards {
                grid-template-columns: 1fr;
            }

            .panel-page.active {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;

                border-left: none;
                border-bottom: 1px solid rgba(60,40,20,.08);

                padding: 10px;
            }

            .sidebar-title {
                display: none;
            }

            .side-button {
                width: auto;
                display: inline-block;
                margin-left: 5px;
            }

            .content {
                padding: 25px 16px;
            }

            .user-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .delete-user-btn {
                width: 100%;
            }

            .user-details {
                flex-direction: column;
                gap: 7px;
            }

            .add-code {
                flex-direction: column;
            }

            .add-code button {
                height: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="brand">
            س.ح.ن
        </div>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="منو"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </nav>


    <!-- ================= DROPDOWN ================= -->

    <div
        class="dropdown"
        id="dropdown"
    >
        <button
            type="button"
            onclick="logout()"
        >
            ↩ خروج از پنل
        </button>
    </div>


    <!-- ================= HOME ================= -->

    <main
        class="home"
        id="home-page"
    >

        <h1 class="home-title">
            پنل کارمند
        </h1>

        <p class="home-subtitle">
            مدیریت بخش‌های مختلف سایت
        </p>

        <div class="home-cards">

            <button
                class="home-card"
                type="button"
                onclick="openSection('changes')"
            >
                <div class="home-card-icon">
                    ⚙️
                </div>

                <div class="home-card-title">
                    تغییرات صفحه کاربر
                </div>
            </button>


            <button
                class="home-card"
                type="button"
                onclick="openSection('people')"
            >
                <div class="home-card-icon">
                    👥
                </div>

                <div class="home-card-title">
                    دیدن افراد
                </div>
            </button>

        </div>

    </main>


    <!-- ================= CHANGES ================= -->

    <section
        class="panel-page"
        id="changes-page"
    >

        <aside class="sidebar">

            <div class="sidebar-title">
                تغییرات صفحه کاربر
            </div>

            <button
                class="side-button active"
                type="button"
            >
                صفحه کاربر
            </button>

        </aside>

        <div class="content">

            <h2 class="content-title">
                تغییرات صفحه کاربر
            </h2>

            <p class="content-description">
                تنظیمات و تغییرات صفحه کاربر
            </p>

        </div>

    </section>


    <!-- ================= PEOPLE ================= -->

    <section
        class="panel-page"
        id="people-page"
    >

        <aside class="sidebar">

            <div class="sidebar-title">
                افراد
            </div>

            <button
                class="side-button active"
                id="users-side-button"
                type="button"
                onclick="showPeopleSection('users')"
            >
                کاربر
            </button>

            <button
                class="side-button"
                id="employees-side-button"
                type="button"
                onclick="showPeopleSection('employees')"
            >
                کارمند
            </button>

        </aside>


        <!-- ================= USERS ================= -->

        <div
            class="content"
            id="users-section"
        >

            <h2 class="content-title">
                کاربران
            </h2>

            <p class="content-description">
                فهرست کاربران ثبت‌شده
            </p>

            <div class="users-box">

                <div class="users-header">

                    <strong>
                        کاربران
                    </strong>

                    <span
                        class="users-count"
                        id="users-count"
                    >
                        در حال دریافت...
                    </span>

                </div>

                <div id="users-list">

                    <div class="loading">
                        در حال دریافت کاربران...
                    </div>

                </div>

            </div>

        </div>


        <!-- ================= EMPLOYEES ================= -->

        <div
            class="content"
            id="employees-section"
            style="display:none;"
        >

            <h2 class="content-title">
                کارمندان
            </h2>

            <p class="content-description">
                مدیریت کدهای ورود کارمندان
            </p>

            <div class="codes-box">

                <div class="add-code">

                    <input
                        id="new-code"
                        type="text"
                        placeholder="کد جدید کارمند"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        onclick="addEmployeeCode()"
                    >
                        افزودن
                    </button>

                </div>

                <div id="codes-list">

                    <div class="loading">
                        در حال دریافت کدها...
                    </div>

                </div>

            </div>

        </div>

    </section>


    <script>

        /* ================= SUPABASE ================= */

        const SUPABASE_URL =
            "https://zyziyyhzxsnwzrsubulu.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_RIGsFvG_eSFBmXYAxe8UHA_JQjhVkpR";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ================= MENU ================= */

        const menuButton =
            document.getElementById("menu-button");

        const dropdown =
            document.getElementById("dropdown");

        menuButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                dropdown.classList.toggle("open");

            }
        );

        document.addEventListener(
            "click",
            function () {

                dropdown.classList.remove("open");

            }
        );

        dropdown.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

            }
        );


        /* ================= NAVIGATION ================= */

        function openSection(section) {

            document.getElementById(
                "home-page"
            ).style.display = "none";

            document.querySelectorAll(
                ".panel-page"
            ).forEach(page => {

                page.classList.remove("active");

            });

            if (section === "changes") {

                document.getElementById(
                    "changes-page"
                ).classList.add("active");

            }

            if (section === "people") {

                document.getElementById(
                    "people-page"
                ).classList.add("active");

                showPeopleSection("users");

            }

        }


        /* ================= PEOPLE SECTIONS ================= */

        function showPeopleSection(section) {

            const usersSection =
                document.getElementById(
                    "users-section"
                );

            const employeesSection =
                document.getElementById(
                    "employees-section"
                );

            const usersButton =
                document.getElementById(
                    "users-side-button"
                );

            const employeesButton =
                document.getElementById(
                    "employees-side-button"
                );


            if (section === "users") {

                usersSection.style.display =
                    "block";

                employeesSection.style.display =
                    "none";

                usersButton.classList.add(
                    "active"
                );

                employeesButton.classList.remove(
                    "active"
                );

                loadPeople();

            }


            if (section === "employees") {

                usersSection.style.display =
                    "none";

                employeesSection.style.display =
                    "block";

                usersButton.classList.remove(
                    "active"
                );

                employeesButton.classList.add(
                    "active"
                );

                loadEmployeeCodes();

            }

        }


        /* ================= LOAD USERS ================= */

        async function loadPeople() {

            const container =
                document.getElementById(
                    "users-list"
                );

            const countElement =
                document.getElementById(
                    "users-count"
                );

            if (!container) return;


            container.innerHTML = `
                <div class="loading">
                    در حال دریافت کاربران...
                </div>
            `;


            if (countElement) {

                countElement.textContent =
                    "در حال دریافت...";

            }


            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    "manage-users",
                    {
                        body: {
                            action: "list"
                        }
                    }
                );


            if (error) {

                console.error(
                    "LOAD USERS ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty-state">
                        خطا در دریافت کاربران
                    </div>
                `;

                if (countElement) {

                    countElement.textContent =
                        "خطا";

                }

                return;
            }


            if (!data?.success) {

                container.innerHTML = `
                    <div class="empty-state">
                        ${escapeHtml(
                            data?.error ||
                            "دریافت کاربران انجام نشد."
                        )}
                    </div>
                `;

                if (countElement) {

                    countElement.textContent =
                        "خطا";

                }

                return;
            }


            const users =
                Array.isArray(data.users)
                    ? data.users
                    : [];


            if (countElement) {

                countElement.textContent =
                    `${users.length} کاربر`;

            }


            if (users.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        هنوز کاربری ثبت نشده است.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                users.map(user => {

                    const userId =
                        String(
                            user.id || ""
                        ).trim();


                    const fullName =
                        [
                            user.first_name,
                            user.last_name
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .trim() ||
                        "کاربر بدون نام";


                    const phone =
                        user.phone ||
                        "ثبت نشده";


                    const email =
                        user.email ||
                        "ثبت نشده";


                    return `
                        <div
                            class="user-row"
                            data-user-id="${escapeHtml(userId)}"
                        >

                            <div class="user-info">

                                <div class="user-name">
                                    ${escapeHtml(fullName)}
                                </div>

                                <div class="user-details">

                                    <div>
                                        <span>شماره:</span>
                                        ${escapeHtml(phone)}
                                    </div>

                                    <div>
                                        <span>ایمیل:</span>
                                        ${escapeHtml(email)}
                                    </div>

                                </div>

                            </div>


                            <button
                                type="button"
                                class="delete-user-btn"
                                data-user-id="${escapeHtml(userId)}"
                            >
                                حذف
                            </button>

                        </div>
                    `;

                }).join("");


            /*
             * شناسه حذف مستقیماً از همان دکمه گرفته می‌شود.
             * بنابراین هر دکمه دقیقاً کاربر همان ردیف را حذف می‌کند.
             */

            container
                .querySelectorAll(
                    ".delete-user-btn"
                )
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        async function () {

                            const userId =
                                String(
                                    button.dataset.userId ||
                                    ""
                                ).trim();


                            await deleteUserAccount(
                                userId,
                                button
                            );

                        }
                    );

                });

        }


        /* ================= DELETE USER ================= */

        async function deleteUserAccount(
            userId,
            button
        ) {

            userId =
                String(
                    userId || ""
                ).trim();


            if (!userId) {

                alert(
                    "شناسه کاربر مشخص نیست."
                );

                return;
            }


            const confirmed =
                confirm(
                    "آیا این کاربر حذف شود؟\n" +
                    "این عملیات حساب کاربری را نیز حذف می‌کند."
                );


            if (!confirmed) return;


            if (button) {

                button.disabled = true;

                button.textContent =
                    "در حال حذف...";

            }


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient.functions.invoke(
                        "manage-users",
                        {
                            body: {
                                action: "delete",
                                user_id: userId
                            }
                        }
                    );


                if (error) {

                    console.error(
                        "DELETE USER ERROR:",
                        error
                    );

                    alert(
                        "حذف کاربر انجام نشد."
                    );

                    await loadPeople();

                    return;
                }


                if (!data?.success) {

                    alert(
                        data?.error ||
                        "حذف کاربر انجام نشد."
                    );

                    await loadPeople();

                    return;
                }


                await loadPeople();

            }
            catch (err) {

                console.error(
                    "DELETE USER EXCEPTION:",
                    err
                );

                alert(
                    "هنگام حذف کاربر خطایی رخ داد."
                );

                await loadPeople();

            }

        }


        /* ================= EMPLOYEE CODES ================= */

        async function loadEmployeeCodes() {

            const container =
                document.getElementById(
                    "codes-list"
                );

            if (!container) return;


            container.innerHTML = `
                <div class="loading">
                    در حال دریافت کدها...
                </div>
            `;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "list_employee_codes"
                );


            if (error) {

                console.error(
                    "LOAD CODES ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty-state">
                        خطا در دریافت کدها
                    </div>
                `;

                return;
            }


            const codes =
                Array.isArray(data)
                    ? data
                    : [];


            if (codes.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        هنوز کدی ثبت نشده است.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                codes.map(code => {

                    const codeId =
                        Number(code.id);


                    return `
                        <div
                            class="code-row"
                            data-code-id="${escapeHtml(codeId)}"
                        >

                            <span class="code-value">
                                ${escapeHtml(
                                    code.code || ""
                                )}
                            </span>


                            <button
                                type="button"
                                class="delete-code"
                                onclick="deleteEmployeeCode(${codeId})"
                            >
                                حذف
                            </button>

                        </div>
                    `;

                }).join("");

        }


        /* ================= ADD CODE ================= */

        async function addEmployeeCode() {

            const input =
                document.getElementById(
                    "new-code"
                );

            if (!input) return;


            const code =
                input.value.trim();


            if (!code) {

                alert(
                    "کد کارمند را وارد کنید."
                );

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "add_employee_code",
                    {
                        p_code: code
                    }
                );


            if (error) {

                console.error(
                    "ADD CODE ERROR:",
                    error
                );

                alert(
                    "افزودن کد انجام نشد."
                );

                return;
            }


            if (!data?.success) {

                alert(
                    data?.error ||
                    "افزودن کد انجام نشد."
                );

                return;
            }


            input.value = "";

            await loadEmployeeCodes();

        }


        /* ================= DELETE CODE ================= */

        async function deleteEmployeeCode(
            id
        ) {

            if (
                !confirm(
                    "آیا این کد حذف شود؟"
                )
            ) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "delete_employee_code",
                    {
                        p_id: id
                    }
                );


            if (error) {

                console.error(
                    "DELETE CODE ERROR:",
                    error
                );

                alert(
                    "حذف کد انجام نشد."
                );

                return;
            }


            if (!data?.success) {

                alert(
                    data?.error ||
                    "حذف کد انجام نشد."
                );

                return;
            }


            await loadEmployeeCodes();

        }


        /* ================= LOGOUT ================= */

        async function logout() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "index.html";

        }


        /* ================= ESCAPE HTML ================= */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* ================= START ================= */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const {
                    data
                } =
                    await supabaseClient.auth.getSession();


                if (!data?.session) {

                    window.location.href =
                        "index.html";

                    return;
                }


                const {
                    data: authorized,
                    error
                } =
                    await supabaseClient.rpc(
                        "is_employee_authorized"
                    );


                if (
                    error ||
                    authorized !== true
                ) {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "index.html";

                    return;
                }

            }
        );

    </script>

</body>
</html>
