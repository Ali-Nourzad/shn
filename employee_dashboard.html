
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل | س.ح.ن</title>
<style>
:root{
 --accent:#8b5cf6;--soft:rgba(139,92,246,.15);
 --bg:#10121b;--card:#1b1e2b;--text:#f5f5fa;
 --muted:#a7a9bd;--border:#343749;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 85% 0%,var(--soft),transparent 42%),var(--bg);font-family:Tahoma,Arial,sans-serif;transition:.25s}
button,input{font:inherit}
button{cursor:pointer}
header{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold}
.logo{background:var(--accent);color:white;border-radius:13px;padding:12px;font-size:15px;box-shadow:0 5px 22px var(--soft)}
.brand small{display:block;color:var(--muted);font-weight:normal;margin-top:5px}
.menu-wrap{position:relative}
.menu-button{width:45px;height:43px;border:1px solid var(--border);border-radius:13px;background:var(--card);color:white;font-size:25px}
.dropdown{display:none;position:absolute;left:0;top:52px;width:230px;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:8px;z-index:10;box-shadow:0 15px 40px #0007}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:right;padding:12px;border:0;border-radius:9px;background:transparent;color:var(--text);font-size:13px}
.dropdown button:hover{background:var(--soft)}
.palette{display:none;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 7px}
.palette.open{display:grid}
.swatch{height:30px;border:2px solid #ffffff35;border-radius:8px}
.swatch.selected{outline:2px solid white;outline-offset:2px}
.shades{display:none;flex-wrap:wrap;gap:5px;padding:0 7px 10px}
.shade{flex:1;min-width:30px;height:25px;border:1px solid #ffffff40;border-radius:6px}
main{max-width:1000px;margin:auto;padding:42px 22px}
.page{display:none}
.page.active{display:block}
h1{font-size:27px;margin:0 0 12px}
.subtitle{font-size:14px;line-height:2;color:var(--muted);margin-bottom:30px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.home-card{display:block;width:100%;min-height:185px;text-align:right;padding:25px;border-radius:20px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);border:1px solid var(--border);color:var(--text);transition:.2s}
.home-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--soft);color:var(--accent);font-size:24px;margin-bottom:20px}
.home-card h2{font-size:18px;margin:0 0 10px}
.home-card p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.back{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:25px}
.back:hover{border-color:var(--accent);color:var(--text)}
.tabs{display:flex;gap:9px;margin:25px 0 20px}
.tab{padding:11px 22px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 17px}
label{display:block;font-size:13px;color:var(--muted);margin:13px 0 8px}
input{width:100%;padding:13px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
.primary{background:var(--accent);color:white;border:0;border-radius:10px;padding:12px 18px;margin-top:12px}
.secondary{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 15px;margin-top:12px}
.message{font-size:13px;margin-top:12px;line-height:1.9}
.success{color:#5ee0a0}.error{color:#ff7b8b}
.code-list{display:grid;gap:10px;margin-top:18px}
.code-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:11px}
.code-text{overflow-wrap:anywhere;word-break:break-word}
.code-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.delete{background:#632c3a;color:#ffb8c3;border:0;border-radius:8px;padding:8px 12px}
.copy{background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.empty{color:var(--muted);font-size:13px;line-height:2}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(max-width:500px){
 header{padding:0 18px}
 main{padding:30px 17px}
 h1{font-size:24px}
 .code-item{align-items:flex-start;flex-direction:column}
 .code-actions{align-self:flex-end}
}
</style>
</head>
<body>
<header>
 <div class="brand">
  <div class="logo">س.ح.ن</div>
  <div>پنل<small>مدیریت</small></div>
 </div>
 <div class="menu-wrap">
  <button class="menu-button" id="menuBtn" aria-label="منو">•••</button>
  <div class="dropdown" id="menu">
   <button id="colorBtn">🎨 انتخاب رنگ</button>
   <div class="palette" id="palette"></div>
   <div class="shades" id="shades"></div>
   <button id="exitPageBtn">خروج از صفحه</button>
   <button id="exitPanelBtn">خروج از پنل</button>
  </div>
 </div>
</header>

<main>
 <section id="home" class="page active">
  <h1>خوش آمدید</h1>
  <div class="subtitle">به پنل مدیریت س.ح.ن خوش آمدید.</div>
  <div class="home-grid">
   <button class="home-card" onclick="openPage('people')">
    <div class="card-icon">♙</div>
    <h2>افراد</h2>
    <p>مدیریت بخش کاربران و کارکنان</p>
   </button>
   <button class="home-card" onclick="openPage('changes')">
    <div class="card-icon">⚙</div>
    <h2>تغییرات صفحه‌ی کاربر</h2>
    <p>تنظیمات و تغییرات صفحه‌ی کاربر</p>
   </button>
  </div>
 </section>

 <section id="people" class="page">
  <button class="back" onclick="openPage('home')">← بازگشت به پنل</button>
  <h1>افراد</h1>
  <div class="subtitle">بخش موردنظر را انتخاب کنید.</div>
  <div class="tabs">
   <button class="tab active" data-tab="user">کاربر</button>
   <button class="tab" data-tab="employee">کارمند</button>
  </div>
  <div id="userSection" class="panel"></div>
  <div id="employeeSection" class="panel" style="display:none">
   <button class="primary" id="showAddForm">＋ افزودن / ساختن کد</button>
   <form id="employeeForm" style="display:none">
    <h2 style="margin-top:24px">ساخت کد کارمند</h2>
    <label for="code1">کد کارمند</label>
    <input id="code1" autocomplete="off" required>
    <button class="primary" type="submit">ثبت کد</button>
    <button class="secondary" type="button" id="cancelAdd">انصراف</button>
    <div id="formMessage" class="message" aria-live="polite"></div>
   </form>
   <h2 style="margin-top:28px">کدهای کارمندان</h2>
   <div id="codeList" class="code-list"></div>
  </div>
 </section>

 <section id="changes" class="page">
  <button class="back" onclick="openPage('home')">← بازگشت به پنل</button>
  <h1>تغییرات صفحه‌ی کاربر</h1>
  <div class="subtitle">بخش تنظیمات صفحه‌ی کاربر</div>
  <div class="panel"><div class="empty">فعلاً تغییری برای نمایش وجود ندارد.</div></div>
 </section>
</main>
<footer>س.ح.ن · پنل مدیریت</footer>

<script>
const $=id=>document.getElementById(id);

function openPage(name){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 $(name).classList.add('active');
 $('menu').classList.remove('open');
 $('exitPageBtn').style.display=name==='home'?'none':'block';
 $('exitPageBtn').textContent=
  name==='people'?'خروج از افراد':
  name==='changes'?'خروج از تغییرات صفحه‌ی کاربر':'خروج از صفحه';
 window.scrollTo(0,0);
}

$('menuBtn').onclick=()=>$('menu').classList.toggle('open');
$('exitPageBtn').onclick=()=>openPage('home');
$('exitPanelBtn').onclick=()=>{
 $('menu').classList.remove('open');
 window.location.href='./index.html';
};

document.addEventListener('click',e=>{
 if(!e.target.closest('.menu-wrap')) $('menu').classList.remove('open');
});

document.querySelectorAll('.tab').forEach(tab=>{
 tab.onclick=()=>{
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  $('userSection').style.display=tab.dataset.tab==='user'?'block':'none';
  $('employeeSection').style.display=tab.dataset.tab==='employee'?'block':'none';
 };
});

$('showAddForm').onclick=()=>{
 $('employeeForm').style.display='block';
 $('showAddForm').style.display='none';
 $('formMessage').textContent='';
 $('code1').focus();
};

$('cancelAdd').onclick=()=>{
 $('employeeForm').reset();
 $('employeeForm').style.display='none';
 $('showAddForm').style.display='inline-block';
 $('formMessage').textContent='';
};

let codes=[];
try{
 const saved=JSON.parse(localStorage.getItem('employeeCodes')||'[]');
 codes=Array.isArray(saved)?saved.filter(code=>typeof code==='string'):[];
}catch(error){codes=[]}

function saveCodes(){
 localStorage.setItem('employeeCodes',JSON.stringify(codes));
}

function showMessage(message,type){
 $('formMessage').className='message '+type;
 $('formMessage').textContent=message;
}

function renderCodes(){
 const list=$('codeList');
 list.replaceChildren();

 if(codes.length===0){
  const empty=document.createElement('div');
  empty.className='empty';
  empty.textContent='هنوز کدی ثبت نشده است.';
  list.appendChild(empty);
  return;
 }

 codes.forEach((code,index)=>{
  const row=document.createElement('div');
  row.className='code-item';

  const text=document.createElement('span');
  text.className='code-text';
  text.textContent=code;

  const actions=document.createElement('div');
  actions.className='code-actions';

  const copy=document.createElement('button');
  copy.type='button';
  copy.className='copy';
  copy.textContent='کپی کد';

  copy.addEventListener('click',async()=>{
   try{
    if(navigator.clipboard&&window.isSecureContext){
     await navigator.clipboard.writeText(code);
    }else{
     const temp=document.createElement('textarea');
     temp.value=code;
     temp.style.position='fixed';
     temp.style.opacity='0';
     document.body.appendChild(temp);
     temp.select();
     const copied=document.execCommand('copy');
     temp.remove();
     if(!copied)throw new Error('copy failed');
    }
    copy.textContent='کپی شد ✓';
    setTimeout(()=>{if(copy.isConnected)copy.textContent='کپی کد'},1300);
   }catch(error){
    showMessage('کپی خودکار انجام نشد؛ کد را انتخاب و کپی کنید.','error');
   }
  });

  const del=document.createElement('button');
  del.type='button';
  del.className='delete';
  del.textContent='حذف';

  del.addEventListener('click',()=>{
   if(!window.confirm('آیا از حذف کد «'+code+'» مطمئن هستید؟'))return;

   const oldCodes=[...codes];

   try{
    codes.splice(index,1);
    saveCodes();
    renderCodes();
    showMessage('کد با موفقیت حذف شد.','success');
   }catch(error){
    codes=oldCodes;
    renderCodes();
    showMessage('ذخیره حذف انجام نشد. فضای ذخیره‌سازی مرورگر را بررسی کنید.','error');
   }
  });

  actions.append(copy,del);
  row.append(text,actions);
  list.appendChild(row);
 });
}

$('employeeForm').addEventListener('submit',e=>{
 e.preventDefault();
 const code=$('code1').value.trim();

 if(!code){
  showMessage('لطفاً کد کارمند را وارد کنید.','error');
  return;
 }

 if(codes.some(item=>item.toLocaleLowerCase()===code.toLocaleLowerCase())){
  showMessage('این کد قبلاً ثبت شده است.','error');
  return;
 }

 const oldCodes=[...codes];
 codes.push(code);

 try{
  saveCodes();
  renderCodes();
  $('employeeForm').reset();
  $('employeeForm').style.display='none';
  $('showAddForm').style.display='inline-block';
  showMessage('✓ کد با موفقیت اضافه شد.','success');
 }catch(error){
  codes=oldCodes;
  showMessage('ذخیره کد انجام نشد. دوباره تلاش کنید.','error');
 }
});

renderCodes();

const themes=[
 {name:'بنفش',h:263,s:85,l:65},
 {name:'صورتی',h:330,s:80,l:62},
 {name:'سبز',h:145,s:60,l:48},
 {name:'قرمز',h:0,s:78,l:58},
 {name:'نارنجی',h:25,s:90,l:55},
 {name:'زرد',h:48,s:95,l:55},
 {name:'فیروزه‌ای',h:175,s:75,l:45},
 {name:'آبی',h:215,s:85,l:60},
 {name:'نیلی',h:235,s:75,l:62},
 {name:'قهوه‌ای',h:25,s:45,l:42},
 {name:'آبی یخی',h:195,s:65,l:72},
 {name:'خاکستری',h:220,s:8,l:65}
];

const shadeNames=['ملایم','مات','معمولی','تیره','پررنگ'];
const adjust=[18,-5,0,-12,-20];
let selected=0,shadeLevel=2;

try{
 selected=Number(localStorage.getItem('themeIndex')||0);
 shadeLevel=Number(localStorage.getItem('shadeLevel')||2);
}catch(error){}

if(!Number.isInteger(selected)||selected<0||selected>=themes.length)selected=0;
if(!Number.isInteger(shadeLevel)||shadeLevel<0||shadeLevel>=shadeNames.length)shadeLevel=2;

function updateShades(){
 document.querySelectorAll('.shade').forEach((b,i)=>{
  const t=themes[selected];
  const l=Math.max(25,Math.min(82,t.l+adjust[i]));
  b.style.background=`hsl(${t.h} ${t.s}% ${l}%)`;
  b.title=shadeNames[i];
  b.style.outline=i===shadeLevel?'2px solid white':'none';
 });
}

function applyTheme(){
 const t=themes[selected];
 const l=Math.max(25,Math.min(82,t.l+adjust[shadeLevel]));
 document.documentElement.style.setProperty('--accent',`hsl(${t.h} ${t.s}% ${l}%)`);
 document.documentElement.style.setProperty('--soft',`hsla(${t.h},${t.s}%,${l}%,.16)`);
 document.documentElement.style.setProperty('--bg',`hsl(${t.h} 18% 9%)`);
 document.documentElement.style.setProperty('--card',`hsl(${t.h} 17% 14%)`);
 document.documentElement.style.setProperty('--border',`hsl(${t.h} 15% 25%)`);

 try{
  localStorage.setItem('themeIndex',selected);
  localStorage.setItem('shadeLevel',shadeLevel);
 }catch(error){}

 document.querySelectorAll('.swatch').forEach((b,i)=>b.classList.toggle('selected',i===selected));
 updateShades();
}

themes.forEach((t,i)=>{
 const b=document.createElement('button');
 b.className='swatch';
 b.title=t.name;
 b.style.background=`hsl(${t.h} ${t.s}% ${t.l}%)`;
 b.onclick=()=>{selected=i;applyTheme()};
 $('palette').append(b);
});

shadeNames.forEach((name,i)=>{
 const b=document.createElement('button');
 b.className='shade';
 b.title=name;
 b.onclick=()=>{shadeLevel=i;applyTheme()};
 $('shades').append(b);
});

$('colorBtn').onclick=()=>{
 $('palette').classList.toggle('open');
 $('shades').style.display=$('palette').classList.contains('open')?'flex':'none';
};

applyTheme();
openPage('home');
</script>
</body>
</html>
