<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل کارمند | س.ح.ن</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-1: #fffaf1;
            --bg-2: #f4ecdf;
            --surface: rgba(255,255,255,.72);
            --surface-strong: rgba(255,255,255,.88);
            --border: rgba(65,48,30,.08);
            --text: #29231d;
            --muted: #8a7d70;
            --muted-2: #a09284;
            --accent: #e3a21a;
            --accent-soft: rgba(227,162,26,.12);
            --dark: #292724;
            --danger: #d94b43;
            --danger-hover: #bd3932;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Tahoma, sans-serif;

            background:
                radial-gradient(
                    circle at 90% 0%,
                    rgba(255,190,45,.20),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(255,210,110,.10),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    var(--bg-1),
                    var(--bg-2)
                );

            color: var(--text);
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 76px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(255,255,255,.70);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border-bottom: 1px solid var(--border);

            box-shadow:
                0 8px 35px rgba(70,45,20,.06);
        }

        .brand {
            font-size: 25px;
            font-weight: 900;
            color: var(--text);
            letter-spacing: -.7px;
        }

        .menu-button {
            width: 46px;
            height: 46px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 14px;

            background: var(--dark);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;

            transition:
                transform .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);

            background: #1f1d1b;

            box-shadow:
                0 9px 20px rgba(30,25,20,.16);
        }

        .menu-button span {
            width: 5px;
            height: 5px;

            background: #fff;
            border-radius: 50%;

            display: block;
        }

        /* ================= MENU ================= */

        .dropdown {
            position: fixed;

            top: 86px;
            left: 25px;

            width: 235px;

            padding: 8px;

            background: rgba(255,255,255,.92);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border: 1px solid var(--border);
            border-radius: 18px;

            box-shadow:
                0 22px 60px rgba(55,38,20,.15);

            opacity: 0;
            visibility: hidden;

            transform: translateY(-8px);

            transition: .2s ease;

            z-index: 999;
        }

        .dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown button {
            width: 100%;

            border: none;
            background: transparent;

            padding: 13px 14px;

            border-radius: 12px;

            text-align: right;

            font-size: 14px;
            color: #39332d;

            transition: .18s ease;
        }

        .dropdown button:hover {
            background: #f7f0e6;
        }

        /* ================= HOME ================= */

        .home {
            min-height: calc(100vh - 76px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }

        .home-title {
            font-size: 36px;
            font-weight: 900;

            margin-bottom: 12px;

            letter-spacing: -.8px;
        }

        .home-subtitle {
            color: var(--muted);

            font-size: 15px;

            margin-bottom: 42px;
        }

        .home-cards {
            width: min(820px, 100%);

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;
        }

        .home-card {
            min-height: 200px;

            border: 1px solid var(--border);
            border-radius: 27px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.82),
                    rgba(255,255,255,.56)
                );

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 16px 45px rgba(80,50,20,.07);

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            gap: 14px;

            color: var(--text);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .home-card:hover {
            transform: translateY(-6px);

            border-color:
                rgba(227,162,26,.22);

            box-shadow:
                0 24px 55px rgba(80,50,20,.12);
        }

        .home-card-icon {
            width: 64px;
            height: 64px;

            border-radius: 19px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 31px;

            background: var(--accent-soft);
        }

        .home-card-title {
            font-size: 19px;
            font-weight: 900;
        }

        /* ================= PANEL ================= */

        .panel-page {
            display: none;

            min-height: calc(100vh - 76px);
        }

        .panel-page.active {
            display: flex;
        }

        .sidebar {
            width: 235px;
            min-width: 235px;

            background: rgba(255,255,255,.50);

            border-left:
                1px solid var(--border);

            padding: 28px 15px;
        }

        .sidebar-title {
            font-size: 15px;
            font-weight: 900;

            padding:
                10px 12px 18px;

            color: #51473d;
        }

        .side-button {
            width: 100%;

            border: none;
            background: transparent;

            padding: 13px 14px;

            border-radius: 13px;

            text-align: right;

            color: #64594e;

            font-size: 14px;

            transition: .18s ease;
        }

        .side-button:hover,
        .side-button.active {
            background:
                rgba(227,162,26,.13);

            color: #956500;
        }

        .content {
            flex: 1;

            padding: 45px;
        }

        .content-title {
            font-size: 26px;
            font-weight: 900;

            margin-bottom: 9px;

            letter-spacing: -.4px;
        }

        .content-description {
            color: var(--muted);

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* ================= USERS ================= */

        .users-box {
            width: 100%;
            max-width: 950px;

            background: var(--surface);

            border:
                1px solid var(--border);

            border-radius: 23px;

            overflow: hidden;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 18px 45px rgba(80,50,20,.07);
        }

        .users-header {
            padding: 18px 21px;

            border-bottom:
                1px solid rgba(60,40,20,.07);

            display: flex;

            justify-content: space-between;
            align-items: center;
        }

        .users-count {
            color: var(--muted);

            font-size: 13px;
        }

        .user-row {
            padding: 21px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            border-bottom:
                1px solid rgba(60,40,20,.07);

            transition:
                background .18s ease;
        }

        .user-row:hover {
            background:
                rgba(255,255,255,.42);
        }

        .user-row:last-child {
            border-bottom: none;
        }

        .user-info {
            min-width: 0;
            flex: 1;
        }

        .user-name {
            font-size: 16px;
            font-weight: 900;

            margin-bottom: 10px;
        }

        .user-details {
            display: flex;
            flex-wrap: wrap;

            gap: 9px 25px;

            color: #776b60;

            font-size: 12px;
        }

        .user-details span {
            color: var(--muted-2);
        }

        .delete-user-btn {
            flex-shrink: 0;

            border: none;
            border-radius: 11px;

            padding: 10px 18px;

            background: var(--danger);
            color: white;

            font-size: 12px;

            transition: .18s ease;
        }

        .delete-user-btn:hover {
            background: var(--danger-hover);

            transform: translateY(-1px);
        }

        .delete-user-btn:disabled {
            opacity: .6;
            cursor: wait;

            transform: none;
        }

        /* ================= EMPLOYEES ================= */

        .codes-box {
            width: 100%;
            max-width: 700px;
        }

        .new-code-button {
            border: none;

            border-radius: 14px;

            padding: 14px 20px;

            background:
                linear-gradient(
                    135deg,
                    #302d29,
                    #1f1d1b
                );

            color: white;

            font-size: 13px;
            font-weight: 700;

            box-shadow:
                0 10px 25px rgba(35,30,25,.12);

            transition: .2s ease;
        }

        .new-code-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(35,30,25,.17);
        }

        /* ================= NEW CODE FORM ================= */

        .new-code-form {
            display: none;

            margin-top: 18px;

            padding: 22px;

            background:
                rgba(255,255,255,.74);

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                0 14px 35px rgba(80,50,20,.06);
        }

        .new-code-form.open {
            display: block;
        }

        .form-title {
            font-size: 15px;
            font-weight: 900;

            margin-bottom: 17px;
        }

        .form-field {
            margin-bottom: 12px;
        }

        .form-field label {
            display: block;

            font-size: 12px;

            color: #776b60;

            margin-bottom: 7px;
        }

        .form-field input {
            width: 100%;

            border:
                1px solid #ded3c5;

            background:
                rgba(255,255,255,.82);

            border-radius: 12px;

            padding: 13px 14px;

            outline: none;

            direction: ltr;
            text-align: left;

            transition:
                border-color .18s ease,
                box-shadow .18s ease;
        }

        .form-field input:focus {
            border-color: #d89b18;

            box-shadow:
                0 0 0 4px rgba(216,155,24,.09);
        }

        .form-actions {
            display: flex;

            gap: 9px;

            margin-top: 17px;
        }

        .submit-code {
            border: none;

            border-radius: 11px;

            padding: 11px 18px;

            background: #2c2926;

            color: white;

            font-size: 12px;

            transition: .18s ease;
        }

        .submit-code:hover {
            background: #1f1d1b;
        }

        .cancel-code {
            border: 1px solid #ddd2c5;

            border-radius: 11px;

            padding: 11px 18px;

            background: transparent;

            color: #665b50;

            font-size: 12px;
        }

        /* ================= CODE LIST ================= */

        .code-list-wrapper {
            margin-top: 22px;
        }

        .code-list-title {
            font-size: 14px;
            font-weight: 900;

            margin-bottom: 12px;
        }

        .code-row {
            padding: 15px 17px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            background:
                rgba(255,255,255,.70);

            border:
                1px solid var(--border);

            border-radius: 14px;

            margin-bottom: 10px;

            transition:
                transform .18s ease,
                box-shadow .18s ease;
        }

        .code-row:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 22px rgba(70,45,20,.06);
        }

        .code-value {
            direction: ltr;
            text-align: left;

            font-family: monospace;

            font-size: 14px;
        }

        .delete-code {
            border: none;

            background: var(--danger);
            color: white;

            padding: 8px 13px;

            border-radius: 9px;

            font-size: 12px;

            transition: .18s ease;
        }

        .delete-code:hover {
            background: var(--danger-hover);
        }

        /* ================= STATES ================= */

        .loading,
        .empty-state {
            padding: 35px;

            text-align: center;

            color: #8b7e71;

            font-size: 14px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 17px;
                height: 68px;
            }

            .brand {
                font-size: 21px;
            }

            .home {
                min-height: calc(100vh - 68px);
            }

            .home-title {
                font-size: 28px;
            }

            .home-cards {
                grid-template-columns: 1fr;
            }

            .panel-page.active {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 0;

                border-left: none;

                border-bottom:
                    1px solid var(--border);

                padding: 10px;
            }

            .sidebar-title {
                display: none;
            }

            .side-button {
                width: auto;

                display: inline-block;

                margin-left: 5px;
            }

            .content {
                padding: 27px 16px;
            }

            .content-title {
                font-size: 23px;
            }

            .user-row {
                align-items: flex-start;

                flex-direction: column;
            }

            .delete-user-btn {
                width: 100%;
            }

            .user-details {
                flex-direction: column;

                gap: 7px;
            }

            .new-code-button {
                width: 100%;
            }

            .form-actions {
                flex-direction: column;
            }

            .submit-code,
            .cancel-code {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="brand">
            س.ح.ن
        </div>

        <button
            class="menu-button"
            id="menu-button"
            type="button"
            aria-label="منو"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </nav>


    <!-- ================= MENU ================= -->

    <div
        class="dropdown"
        id="dropdown"
    >
        <button
            type="button"
            onclick="logout()"
        >
            ↩ خروج از پنل
        </button>
    </div>


    <!-- ================= HOME ================= -->

    <main
        class="home"
        id="home-page"
    >

        <h1 class="home-title">
            پنل کارمند
        </h1>

        <p class="home-subtitle">
            مدیریت بخش‌های مختلف سایت
        </p>

        <div class="home-cards">

            <button
                class="home-card"
                type="button"
                onclick="openSection('changes')"
            >

                <div class="home-card-icon">
                    ⚙️
                </div>

                <div class="home-card-title">
                    تغییرات صفحه کاربر
                </div>

            </button>


            <button
                class="home-card"
                type="button"
                onclick="openSection('people')"
            >

                <div class="home-card-icon">
                    👥
                </div>

                <div class="home-card-title">
                    دیدن افراد
                </div>

            </button>

        </div>

    </main>


    <!-- ================= CHANGES ================= -->

    <section
        class="panel-page"
        id="changes-page"
    >

        <aside class="sidebar">

            <div class="sidebar-title">
                تغییرات صفحه کاربر
            </div>

            <button
                class="side-button active"
                type="button"
            >
                صفحه کاربر
            </button>

        </aside>


        <div class="content">

            <h2 class="content-title">
                تغییرات صفحه کاربر
            </h2>

            <p class="content-description">
                تنظیمات و تغییرات صفحه کاربر
            </p>

        </div>

    </section>


    <!-- ================= PEOPLE ================= -->

    <section
        class="panel-page"
        id="people-page"
    >

        <aside class="sidebar">

            <div class="sidebar-title">
                افراد
            </div>

            <button
                class="side-button active"
                type="button"
                onclick="showPeopleSection('users')"
            >
                کاربر
            </button>

            <button
                class="side-button"
                type="button"
                onclick="showPeopleSection('employees')"
            >
                کارمند
            </button>

        </aside>


        <!-- ================= USERS ================= -->

        <div
            class="content"
            id="users-section"
        >

            <h2 class="content-title">
                کاربران
            </h2>

            <p class="content-description">
                فهرست کاربران ثبت‌شده
            </p>


            <div class="users-box">

                <div class="users-header">

                    <strong>
                        کاربران
                    </strong>

                    <span
                        class="users-count"
                        id="users-count"
                    >
                        در حال دریافت...
                    </span>

                </div>


                <div id="users-list">

                    <div class="loading">
                        در حال دریافت کاربران...
                    </div>

                </div>

            </div>

        </div>


        <!-- ================= EMPLOYEES ================= -->

        <div
            class="content"
            id="employees-section"
            style="display:none;"
        >

            <h2 class="content-title">
                کارمندان
            </h2>

            <p class="content-description">
                مدیریت کدهای ورود کارمندان
            </p>


            <div class="codes-box">

                <button
                    type="button"
                    class="new-code-button"
                    onclick="openNewCodeForm()"
                >
                    + ساختن کد جدید
                </button>


                <!-- ================= NEW CODE FORM ================= -->

                <div
                    class="new-code-form"
                    id="new-code-form"
                >

                    <div class="form-title">
                        ثبت کد جدید کارمند
                    </div>


                    <div class="form-field">

                        <label for="new-code">
                            کد جدید
                        </label>

                        <input
                            id="new-code"
                            type="text"
                            placeholder="کد کارمند را وارد کنید"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-field">

                        <label for="repeat-code">
                            تکرار کد
                        </label>

                        <input
                            id="repeat-code"
                            type="text"
                            placeholder="کد را دوباره وارد کنید"
                            autocomplete="off"
                        >

                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            class="submit-code"
                            onclick="addEmployeeCode()"
                        >
                            ثبت کد
                        </button>

                        <button
                            type="button"
                            class="cancel-code"
                            onclick="closeNewCodeForm()"
                        >
                            انصراف
                        </button>

                    </div>

                </div>


                <!-- ================= CODE LIST ================= -->

                <div class="code-list-wrapper">

                    <div class="code-list-title">
                        کدهای فعلی
                    </div>

                    <div id="codes-list">

                        <div class="loading">
                            در حال دریافت کدها...
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script>

        /* ================= SUPABASE ================= */

        const SUPABASE_URL =
            "https://zyziyyhzxsnwzrsubulu.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_RIGsFvG_eSFBmXYAxe8UHA_JQjhVkpR";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ================= MENU ================= */

        const menuButton =
            document.getElementById(
                "menu-button"
            );

        const dropdown =
            document.getElementById(
                "dropdown"
            );


        menuButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                dropdown.classList.toggle(
                    "open"
                );

            }
        );


        document.addEventListener(
            "click",
            function () {

                dropdown.classList.remove(
                    "open"
                );

            }
        );


        dropdown.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

            }
        );


        /* ================= NAVIGATION ================= */

        function openSection(section) {

            document.getElementById(
                "home-page"
            ).style.display = "none";


            document.querySelectorAll(
                ".panel-page"
            ).forEach(page => {

                page.classList.remove(
                    "active"
                );

            });


            if (section === "changes") {

                document.getElementById(
                    "changes-page"
                ).classList.add(
                    "active"
                );

            }


            if (section === "people") {

                document.getElementById(
                    "people-page"
                ).classList.add(
                    "active"
                );

                showPeopleSection(
                    "users"
                );

            }

        }


        /* ================= PEOPLE SECTIONS ================= */

        function showPeopleSection(section) {

            const usersSection =
                document.getElementById(
                    "users-section"
                );

            const employeesSection =
                document.getElementById(
                    "employees-section"
                );

            const buttons =
                document.querySelectorAll(
                    "#people-page .side-button"
                );


            if (section === "users") {

                usersSection.style.display =
                    "block";

                employeesSection.style.display =
                    "none";

                buttons[0]?.classList.add(
                    "active"
                );

                buttons[1]?.classList.remove(
                    "active"
                );

                loadPeople();

            }


            if (section === "employees") {

                usersSection.style.display =
                    "none";

                employeesSection.style.display =
                    "block";

                buttons[0]?.classList.remove(
                    "active"
                );

                buttons[1]?.classList.add(
                    "active"
                );

                loadEmployeeCodes();

            }

        }


        /* ================= LOAD USERS ================= */

        async function loadPeople() {

            const container =
                document.getElementById(
                    "users-list"
                );

            const countElement =
                document.getElementById(
                    "users-count"
                );


            if (!container) return;


            container.innerHTML = `
                <div class="loading">
                    در حال دریافت کاربران...
                </div>
            `;


            if (countElement) {

                countElement.textContent =
                    "در حال دریافت...";

            }


            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    "manage-users",
                    {
                        body: {
                            action: "list"
                        }
                    }
                );


            if (error) {

                console.error(
                    "LOAD USERS ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty-state">
                        خطا در دریافت کاربران
                    </div>
                `;

                if (countElement) {

                    countElement.textContent =
                        "خطا";

                }

                return;
            }


            if (!data?.success) {

                container.innerHTML = `
                    <div class="empty-state">
                        ${escapeHtml(
                            data?.error ||
                            "دریافت کاربران انجام نشد."
                        )}
                    </div>
                `;

                if (countElement) {

                    countElement.textContent =
                        "خطا";

                }

                return;
            }


            const users =
                Array.isArray(data.users)
                    ? data.users
                    : [];


            if (countElement) {

                countElement.textContent =
                    `${users.length} کاربر`;

            }


            if (users.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        هنوز کاربری ثبت نشده است.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                users.map(user => {

                    const userId =
                        String(
                            user.id || ""
                        ).trim();


                    const fullName =
                        [
                            user.first_name,
                            user.last_name
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .trim() ||
                        "کاربر بدون نام";


                    const phone =
                        user.phone ||
                        "ثبت نشده";


                    const email =
                        user.email ||
                        "ثبت نشده";


                    return `
                        <div
                            class="user-row"
                            data-user-id="${escapeHtml(userId)}"
                        >

                            <div class="user-info">

                                <div class="user-name">
                                    ${escapeHtml(fullName)}
                                </div>

                                <div class="user-details">

                                    <div>
                                        <span>شماره:</span>
                                        ${escapeHtml(phone)}
                                    </div>

                                    <div>
                                        <span>ایمیل:</span>
                                        ${escapeHtml(email)}
                                    </div>

                                </div>

                            </div>


                            <button
                                type="button"
                                class="delete-user-btn"
                            >
                                حذف
                            </button>

                        </div>
                    `;

                }).join("");


            /* ================= DELETE BUTTONS ================= */

            container
                .querySelectorAll(
                    ".delete-user-btn"
                )
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        async function () {

                            const row =
                                button.closest(
                                    ".user-row"
                                );


                            if (!row) return;


                            const userId =
                                String(
                                    row.dataset.userId ||
                                    ""
                                ).trim();


                            await deleteUserAccount(
                                userId,
                                button
                            );

                        }
                    );

                });

        }


        /* ================= DELETE USER ================= */

        async function deleteUserAccount(
            userId,
            button
        ) {

            userId =
                String(
                    userId || ""
                ).trim();


            if (!userId) {

                alert(
                    "شناسه کاربر مشخص نیست."
                );

                return;
            }


            const confirmed =
                confirm(
                    "آیا این کاربر حذف شود؟\n" +
                    "این عملیات حساب کاربری را نیز حذف می‌کند."
                );


            if (!confirmed) return;


            button.disabled = true;

            button.textContent =
                "در حال حذف...";


            const {
                data,
                error
            } =
                await supabaseClient.functions.invoke(
                    "manage-users",
                    {
                        body: {
                            action: "delete",
                            user_id: userId
                        }
                    }
                );


            if (error) {

                console.error(
                    "DELETE USER ERROR:",
                    error
                );

                alert(
                    "حذف کاربر انجام نشد."
                );

                await loadPeople();

                return;
            }


            if (!data?.success) {

                alert(
                    data?.error ||
                    "حذف کاربر انجام نشد."
                );

                await loadPeople();

                return;
            }


            await loadPeople();

        }


        /* ================= OPEN NEW CODE FORM ================= */

        function openNewCodeForm() {

            const form =
                document.getElementById(
                    "new-code-form"
                );

            const input =
                document.getElementById(
                    "new-code"
                );

            const repeatInput =
                document.getElementById(
                    "repeat-code"
                );


            if (!form) return;


            form.classList.add(
                "open"
            );


            if (input) {

                input.value = "";

            }


            if (repeatInput) {

                repeatInput.value = "";

            }


            setTimeout(
                function () {

                    input?.focus();

                },
                100
            );

        }


        /* ================= CLOSE NEW CODE FORM ================= */

        function closeNewCodeForm() {

            const form =
                document.getElementById(
                    "new-code-form"
                );

            if (!form) return;

            form.classList.remove(
                "open"
            );

        }


        /* ================= LOAD EMPLOYEE CODES ================= */

        async function loadEmployeeCodes() {

            const container =
                document.getElementById(
                    "codes-list"
                );


            if (!container) return;


            container.innerHTML = `
                <div class="loading">
                    در حال دریافت کدها...
                </div>
            `;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "list_employee_codes"
                );


            if (error) {

                console.error(
                    "LOAD CODES ERROR:",
                    error
                );

                container.innerHTML = `
                    <div class="empty-state">
                        خطا در دریافت کدها
                    </div>
                `;

                return;
            }


            const codes =
                Array.isArray(data)
                    ? data
                    : [];


            if (codes.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">
                        هنوز کدی ثبت نشده است.
                    </div>
                `;

                return;
            }


            container.innerHTML =
                codes.map(code => {

                    return `
                        <div
                            class="code-row"
                            data-code-id="${escapeHtml(code.id)}"
                        >

                            <span class="code-value">
                                ${escapeHtml(
                                    code.code || ""
                                )}
                            </span>

                            <button
                                type="button"
                                class="delete-code"
                                onclick="deleteEmployeeCode(${Number(code.id)})"
                            >
                                حذف
                            </button>

                        </div>
                    `;

                }).join("");

        }


        /* ================= ADD EMPLOYEE CODE ================= */

        async function addEmployeeCode() {

            const input =
                document.getElementById(
                    "new-code"
                );

            const repeatInput =
                document.getElementById(
                    "repeat-code"
                );


            if (!input || !repeatInput) {
                return;
            }


            const code =
                input.value.trim();


            const repeatCode =
                repeatInput.value.trim();


            if (!code) {

                alert(
                    "کد کارمند را وارد کنید."
                );

                input.focus();

                return;
            }


            if (!repeatCode) {

                alert(
                    "تکرار کد را وارد کنید."
                );

                repeatInput.focus();

                return;
            }


            if (code !== repeatCode) {

                alert(
                    "کد و تکرار کد یکسان نیستند."
                );

                repeatInput.focus();

                return;
            }


            if (code.length < 4) {

                alert(
                    "کد کارمند باید حداقل ۴ کاراکتر باشد."
                );

                input.focus();

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "add_employee_code",
                    {
                        p_code: code
                    }
                );


            if (error) {

                console.error(
                    "ADD CODE ERROR:",
                    error
                );

                alert(
                    "افزودن کد انجام نشد."
                );

                return;
            }


            if (!data?.success) {

                alert(
                    data?.error ||
                    "افزودن کد انجام نشد."
                );

                return;
            }


            input.value = "";
            repeatInput.value = "";


            closeNewCodeForm();


            await loadEmployeeCodes();

        }


        /* ================= DELETE CODE ================= */

        async function deleteEmployeeCode(
            id
        ) {

            if (
                !confirm(
                    "آیا این کد حذف شود؟"
                )
            ) {

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "delete_employee_code",
                    {
                        p_id: id
                    }
                );


            if (error) {

                console.error(
                    "DELETE CODE ERROR:",
                    error
                );

                alert(
                    "حذف کد انجام نشد."
                );

                return;
            }


            if (!data?.success) {

                alert(
                    data?.error ||
                    "حذف کد انجام نشد."
                );

                return;
            }


            await loadEmployeeCodes();

        }


        /* ================= LOGOUT ================= */

        async function logout() {

            await supabaseClient.auth.signOut();

            window.location.href =
                "index.html";

        }


        /* ================= ESCAPE HTML ================= */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

        }


        /* ================= START ================= */

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                const {
                    data
                } =
                    await supabaseClient.auth.getSession();


                if (!data?.session) {

                    window.location.href =
                        "index.html";

                    return;
                }


                const {
                    data: authorized,
                    error
                } =
                    await supabaseClient.rpc(
                        "is_employee_authorized"
                    );


                if (
                    error ||
                    authorized !== true
                ) {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "index.html";

                    return;
                }

            }
        );

    </script>

</body>
</html>
