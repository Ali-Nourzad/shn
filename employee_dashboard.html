<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل | س.ح.ن</title>
<style>
:root{--accent:#8b5cf6;--soft:rgba(139,92,246,.15);--bg:#10121b;--card:#1b1e2b;--text:#f5f5fa;--muted:#a7a9bd;--border:#343749;--green:#35d399;--blue:#2997ff;--red:#ff4d5e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 85% 0%,var(--soft),transparent 42%),var(--bg);font-family:Tahoma,Arial,sans-serif;transition:.25s}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold}
.logo{background:var(--accent);color:white;border-radius:13px;padding:12px;font-size:15px;box-shadow:0 5px 22px var(--soft)}
.brand small{display:block;color:var(--muted);font-weight:normal;margin-top:5px}
.menu-wrap{position:relative}
.menu-button{width:45px;height:43px;border:1px solid var(--border);border-radius:13px;background:var(--card);color:white;font-size:25px}
.dropdown{display:none;position:absolute;left:0;top:52px;width:250px;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:8px;z-index:50;box-shadow:0 15px 40px #0007;max-height:75vh;overflow:auto}
.dropdown.open{display:block}
.dropdown button{display:block;width:100%;text-align:right;padding:12px;border:0;border-radius:9px;background:transparent;color:var(--text);font-size:13px}
.dropdown button:hover{background:var(--soft)}
.palette{display:none;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 7px}
.palette.open{display:grid}
.swatch{height:30px;border:2px solid #ffffff35;border-radius:8px}
.shades{display:none;flex-wrap:wrap;gap:5px;padding:0 7px 10px}
.shade{flex:1;min-width:30px;height:25px;border:1px solid #ffffff40;border-radius:6px}
main{max-width:1000px;margin:auto;padding:42px 22px}
.page{display:none}.page.active{display:block}
h1{font-size:27px;margin:0 0 12px}
.subtitle{font-size:14px;line-height:2;color:var(--muted);margin-bottom:30px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.home-card{display:block;width:100%;min-height:185px;text-align:right;padding:25px;border-radius:20px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);border:1px solid var(--border);color:var(--text);transition:.2s}
.home-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--soft);color:var(--accent);font-size:24px;margin-bottom:20px}
.home-card h2{font-size:18px;margin:0 0 10px}.home-card p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.back{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:25px}
.back:hover{border-color:var(--accent);color:var(--text)}
.tabs{display:flex;gap:9px;margin:25px 0 20px}
.tab{padding:11px 22px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 17px}
label{display:block;font-size:13px;color:var(--muted);margin:13px 0 8px}
input,textarea,select{width:100%;padding:13px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);outline:none}
textarea{min-height:85px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.primary{background:var(--accent);color:white;border:0;border-radius:10px;padding:12px 18px;margin-top:12px}
.secondary{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 15px;margin-top:12px}
.message{font-size:13px;margin-top:12px;line-height:1.9}
.success{color:#5ee0a0}.error{color:#ff7b8b}
.code-list{display:grid;gap:10px;margin-top:18px}
.code-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:11px}
.code-text{overflow-wrap:anywhere;word-break:break-word}
.code-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.delete{background:#632c3a;color:#ffb8c3;border:0;border-radius:8px;padding:8px 12px}
.copy{background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.empty{color:var(--muted);font-size:13px;line-height:2}
.builder-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}
.add-round,.page-add{width:52px;height:52px;border-radius:50%;border:1px solid var(--green);background:rgba(53,211,153,.12);color:var(--green);font-size:29px;box-shadow:0 0 0 4px rgba(53,211,153,.04)}
.tile-grid,.inner-tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:18px}
.tile{position:relative;min-height:185px;text-align:right;padding:23px;border-radius:20px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);border:1px solid var(--border);color:var(--text);transition:.2s;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile-image{width:62px;height:62px;object-fit:cover;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:26px;margin-bottom:15px}
.tile-title{font-weight:bold;font-size:17px;margin-bottom:9px;overflow-wrap:anywhere}
.tile-description{font-size:13px;color:var(--muted);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.tile-tools{position:absolute;top:10px;left:10px;display:flex;gap:6px;opacity:0;transition:.2s;z-index:2}
.tile:hover .tile-tools,.tile:focus-within .tile-tools{opacity:1}
.tile-tool{width:32px;height:32px;border-radius:9px;font-size:18px;padding:0}
.tile-delete{color:#ff8490;background:rgba(255,77,94,.14);border:1px solid var(--red)}
.tile-edit{color:#76bdff;background:rgba(41,151,255,.14);border:1px solid var(--blue)}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;z-index:100;align-items:center;justify-content:center;padding:18px}
.modal-bg.open{display:flex}
.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:23px;box-shadow:0 20px 70px #0008}
.modal h2{margin:0 0 10px;font-size:19px}.modal p{color:var(--muted);font-size:13px;line-height:1.9}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.type-option{display:block;width:100%;padding:15px;margin:8px 0;text-align:right;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
.type-option:hover{border-color:var(--accent)}
.profile-head{display:flex;gap:18px;align-items:center;padding:22px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);margin-bottom:18px}
.profile-avatar{width:82px;height:82px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);background:var(--soft);display:grid;place-items:center;font-size:32px;flex-shrink:0}
.profile-head h2{margin:0 0 7px}.profile-head p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.detail-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.detail{padding:14px;border:1px solid var(--border);background:var(--bg);border-radius:12px;min-width:0}
.detail span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
.detail strong{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.content-button{width:100%;text-align:right;padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);margin:7px 0}
.content-button:hover{border-color:var(--accent)}
.drop-options{display:none;margin:4px 0 12px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px}
.drop-options.open{display:block}
.drop-options button{display:block;width:100%;padding:11px;text-align:right;border:0;border-radius:8px;background:transparent;color:var(--text)}
.drop-options button:hover{background:var(--soft)}
.page-tools{display:flex;justify-content:flex-end;margin-bottom:14px}
.page-add{width:46px;height:46px;font-size:25px}
.editor-check{display:flex;align-items:center;gap:9px;line-height:1.8}
.editor-check label{margin:8px 0}
.editor-check input{width:auto}
.recording-panel{border:1px solid var(--border);background:var(--bg);padding:15px;border-radius:13px;margin:12px 0}
.recording-panel audio{width:100%;margin-top:10px}
.recording-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.recording-actions button{padding:9px 12px;border-radius:9px}
.record-start{background:rgba(255,77,94,.13);border:1px solid var(--red);color:#ff9ba5}
.record-stop{background:var(--soft);border:1px solid var(--border);color:var(--text)}
.note-item{padding:15px;border:1px solid var(--border);border-radius:12px;background:var(--bg);margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note-item audio{width:100%;margin-top:12px}
.note-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.note-head strong{font-size:14px}
.small-delete{border:1px solid var(--red);background:rgba(255,77,94,.12);color:#ff929d;border-radius:8px;padding:6px 10px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(max-width:500px){header{padding:0 18px}main{padding:30px 17px}h1{font-size:24px}.tile-tools{opacity:1}.code-item{align-items:flex-start;flex-direction:column}.code-actions{align-self:flex-end}.profile-head{align-items:flex-start}.tile-grid,.inner-tile-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">س.ح.ن</div><div>پنل<small>مدیریت</small></div></div>
 <div class="menu-wrap">
  <button class="menu-button" id="menuBtn" aria-label="منو">•••</button>
  <div class="dropdown" id="menu">
   <button id="colorBtn">🎨 انتخاب رنگ</button>
   <div class="palette" id="palette"></div><div class="shades" id="shades"></div>
   <div id="dynamicExitOptions"></div>
   <button id="exitPageBtn">خروج از صفحه‌ی فعلی</button>
   <button id="exitPeopleBtn">خروج از افراد</button>
   <button id="exitPanelBtn">خروج از پنل</button>
  </div>
 </div>
</header>

<main>
 <section id="home" class="page active">
  <h1>خوش آمدید</h1>
  <div class="subtitle">به پنل مدیریت س.ح.ن خوش آمدید.</div>
  <div class="home-grid">
   <button class="home-card" onclick="openPage('people',true,null)"><div class="card-icon">♙</div><h2>افراد</h2><p>مدیریت بخش کاربران و کارکنان</p></button>
   <button class="home-card" onclick="openPage('userChanges',true,null)"><div class="card-icon">✎</div><h2>تغییرات صفحه‌ی کاربر</h2><p>ساخت و مدیریت کارت‌ها، نوشته‌ها و صوت‌ها</p></button>
  </div>
 </section>

 <section id="people" class="page">
  <button class="back" onclick="openPage('home',true,null)">← بازگشت به پنل</button>
  <h1>افراد</h1><div class="subtitle">بخش موردنظر را انتخاب کنید.</div>
  <div class="tabs"><button class="tab active" data-tab="user">کاربر</button><button class="tab" data-tab="employee">کارمند</button></div>
  <div id="userSection" class="panel"><div class="empty">صفحه‌ی کاربر</div><button class="primary" onclick="openPage('userChanges',true,null)">مدیریت صفحه‌ی کاربر</button></div>
  <div id="employeeSection" class="panel" style="display:none">
   <button class="primary" id="showAddForm">＋ افزودن / ساختن کد</button>
   <form id="employeeForm" style="display:none">
    <h2 style="margin-top:24px">ساخت کد کارمند</h2><label for="code1">کد کارمند</label><input id="code1" autocomplete="off" required>
    <button class="primary" type="submit">ثبت کد</button><button class="secondary" type="button" id="cancelAdd">انصراف</button><div id="formMessage" class="message" aria-live="polite"></div>
   </form>
   <h2 style="margin-top:28px">کدهای کارمندان</h2><div id="codeList" class="code-list"></div>
  </div>
 </section>

 <section id="userChanges" class="page">
  <button class="back" onclick="openPage('home',true,null)">← بازگشت به پنل</button>
  <div class="builder-head"><div><h1>تغییرات صفحه‌ی کاربر</h1><div class="subtitle" style="margin:0">ساخت و مدیریت کارت‌ها، نوشته‌ها و صوت‌ها</div></div><button class="add-round" id="addRoot" aria-label="افزودن">＋</button></div>
  <div id="userTiles" class="tile-grid"></div>
 </section>

 <section id="contentPage" class="page">
  <div class="page-tools"><button class="page-add" id="addInside" aria-label="افزودن مورد جدید">＋</button></div>
  <button class="back" id="contentBack">← بازگشت</button><div id="contentArea"></div>
 </section>

 <section id="profilePage" class="page">
  <div class="page-tools"><button class="page-add" id="addProfileInside" aria-label="افزودن مورد جدید">＋</button></div>
  <button class="back" id="profileBack">← بازگشت</button><div id="profileArea"></div>
 </section>
</main>
<footer>س.ح.ن · پنل مدیریت</footer>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
const $=id=>document.getElementById(id);
const DB_KEY='shn_user_page_tiles';
const MEDIA_KEY='shn_page_media_v1';
let currentPage='home',navStack=[],activeTile=null,tiles=[],recordings=[],mediaStream=null,mediaRecorder=null,recordingChunks=[],recordingTarget=null;

try{const data=JSON.parse(localStorage.getItem(DB_KEY)||'[]');tiles=Array.isArray(data)?data:[]}catch(e){tiles=[]}
try{const data=JSON.parse(localStorage.getItem(MEDIA_KEY)||'[]');recordings=Array.isArray(data)?data:[]}catch(e){recordings=[]}

function saveTiles(){localStorage.setItem(DB_KEY,JSON.stringify(tiles))}
function saveRecordings(){localStorage.setItem(MEDIA_KEY,JSON.stringify(recordings))}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function childrenOf(id){return tiles.filter(t=>t.parentId===id)}
function mediaOf(id){return recordings.filter(r=>r.parentId===id)}
function pageLabel(name){if(name==='home')return'پنل';if(name==='people')return'افراد';if(name==='userChanges')return'تغییرات صفحه‌ی کاربر';return activeTile?.title||'صفحه'}

function openPage(name,push=true,nextTile=activeTile){
 if(push&&currentPage!==name)navStack.push({page:currentPage,tile:activeTile});
 currentPage=name;
 activeTile=nextTile;
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===name));
 $('menu').classList.remove('open');
 $('exitPageBtn').textContent='خروج از '+pageLabel(name);
 $('exitPeopleBtn').style.display=['home','people'].includes(name)?'none':'block';
 renderDynamicExits();
 window.scrollTo(0,0);
 renderCurrent();
}

function goBack(){
 const previous=navStack.pop();
 if(previous){openPage(previous.page,false,previous.tile)}
 else{navStack=[];openPage('userChanges',false,null)}
}

/* خروج از یک بخش، به صفحه‌ی والد آن برمی‌گردد. */
function exitToTile(id){
 const tile=tiles.find(t=>t.id===id);
 if(!tile)return;
 navStack=navStack.filter(n=>n.tile?.id!==id);
 if(tile.parentId){
  const parent=tiles.find(t=>t.id===tile.parentId);
  if(parent){
   const parentPage=['writing','audio','button','dropdown'].includes(parent.type)||parent.action==='page'?'contentPage':'profilePage';
   openPage(parentPage,false,parent);
   return;
  }
 }
 openPage('userChanges',false,null);
}

/* فقط گزینه‌های خروج مربوط به مسیر فعلی نمایش داده می‌شوند. */
function renderDynamicExits(){
 const root=$('dynamicExitOptions');
 root.replaceChildren();
 if(!activeTile||currentPage==='home'||currentPage==='people'||currentPage==='userChanges')return;

 let branch=[];
 let current=activeTile;
 const seen=new Set();
 while(current&&!seen.has(current.id)){
  seen.add(current.id);
  branch.unshift(current);
  current=current.parentId?tiles.find(t=>t.id===current.parentId):null;
 }

 branch.forEach(tile=>{
  const b=document.createElement('button');
  b.textContent='خروج از '+tile.title;
  b.onclick=()=>exitToTile(tile.id);
  root.append(b);
 });
}

$('menuBtn').onclick=()=>$('menu').classList.toggle('open');

$('exitPageBtn').onclick=()=>{
 $('menu').classList.remove('open');
 if(currentPage==='home')return;
 goBack();
};

$('exitPeopleBtn').onclick=()=>{
 navStack=[];
 openPage('people',false,null);
};

$('exitPanelBtn').onclick=()=>{
 navStack=[];
 openPage('home',false,null);
};

document.addEventListener('click',e=>{
 if(!e.target.closest('.menu-wrap'))$('menu').classList.remove('open');
});

$('contentBack').onclick=goBack;
$('profileBack').onclick=goBack;

document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===tab));
 $('userSection').style.display=tab.dataset.tab==='user'?'block':'none';
 $('employeeSection').style.display=tab.dataset.tab==='employee'?'block':'none';
});

$('showAddForm').onclick=()=>{
 $('employeeForm').style.display='block';
 $('showAddForm').style.display='none';
 $('formMessage').textContent='';
 $('code1').focus();
};

$('cancelAdd').onclick=()=>{
 $('employeeForm').reset();
 $('employeeForm').style.display='none';
 $('showAddForm').style.display='inline-block';
 $('formMessage').textContent='';
};

let codes=[];
try{const data=JSON.parse(localStorage.getItem('employeeCodes')||'[]');codes=Array.isArray(data)?data.filter(x=>typeof x==='string'):[]}catch(e){codes=[]}
function saveCodes(){localStorage.setItem('employeeCodes',JSON.stringify(codes))}
function showMessage(text,type){$('formMessage').className='message '+type;$('formMessage').textContent=text}

function renderCodes(){
 const list=$('codeList');
 list.replaceChildren();
 if(!codes.length){
  const empty=document.createElement('div');
  empty.className='empty';
  empty.textContent='هنوز کدی ثبت نشده است.';
  list.append(empty);
  return;
 }
 codes.forEach((code,index)=>{
  const row=document.createElement('div');row.className='code-item';
  const text=document.createElement('span');text.className='code-text';text.textContent=code;
  const actions=document.createElement('div');actions.className='code-actions';
  const copy=document.createElement('button');copy.className='copy';copy.textContent='کپی کد';
  copy.onclick=async()=>{
   try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(code);
    else{
     const temp=document.createElement('textarea');
     temp.value=code;temp.style.position='fixed';temp.style.opacity='0';
     document.body.append(temp);temp.select();
     const ok=document.execCommand('copy');temp.remove();
     if(!ok)throw Error();
    }
    copy.textContent='کپی شد ✓';
    setTimeout(()=>{if(copy.isConnected)copy.textContent='کپی کد'},1200);
   }catch(e){showMessage('کپی خودکار نشد؛ کد را دستی کپی کنید.','error')}
  };
  const del=document.createElement('button');del.className='delete';del.textContent='حذف';
  del.onclick=()=>{
   if(!confirm('آیا از حذف این کد مطمئن هستید؟'))return;
   const old=[...codes];codes.splice(index,1);
   try{saveCodes();renderCodes();showMessage('کد حذف شد.','success')}
   catch(e){codes=old;renderCodes();showMessage('ذخیره‌ی حذف انجام نشد.','error')}
  };
  actions.append(copy,del);row.append(text,actions);list.append(row);
 });
}

$('employeeForm').onsubmit=e=>{
 e.preventDefault();
 const code=$('code1').value.trim();
 if(!code)return showMessage('لطفاً کد کارمند را وارد کنید.','error');
 if(codes.some(x=>x.toLowerCase()===code.toLowerCase()))return showMessage('این کد قبلاً ثبت شده است.','error');
 const old=[...codes];codes.push(code);
 try{
  saveCodes();renderCodes();$('employeeForm').reset();
  $('employeeForm').style.display='none';
  $('showAddForm').style.display='inline-block';
  showMessage('کد با موفقیت اضافه شد.','success');
 }catch(e){codes=old;showMessage('ذخیره‌ی کد انجام نشد.','error')}
};
renderCodes();

function showModal(html){$('modal').innerHTML=html;$('modalBg').classList.add('open')}
function closeModal(){$('modalBg').classList.remove('open')}
$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};
$('addRoot').onclick=()=>showTypePicker(null);
$('addInside').onclick=()=>showTypePicker(activeTile?.id||null);
$('addProfileInside').onclick=()=>showTypePicker(activeTile?.id||null);

function showTypePicker(parentId){
 showModal(`<h2>چه چیزی می‌خواهید بسازید؟</h2><p>نوع مورد را انتخاب کنید.</p>
 <button class="type-option" data-type="card">▦ کارت</button>
 <button class="type-option" data-type="button">↗ دکمه</button>
 <button class="type-option" data-type="dropdown">⌄ دکمه‌ی کشویی</button>
 <button class="type-option" data-type="page">▤ صفحه‌ی جدید</button>
 <button class="type-option" data-type="writing">✎ نوشته</button>
 <button class="type-option" data-type="audio">🎙 ضبط صوت</button>
 <div class="modal-actions"><button class="secondary" id="cancelType">انصراف</button></div>`);
 $('cancelType').onclick=closeModal;
 $('modal').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
  closeModal();
  if(b.dataset.type==='audio'){showAudioRecorder(parentId);return}
  showEditor(b.dataset.type,null,parentId);
 });
}

function showEditor(type,item,parentId){
 if(type==='audio'){showAudioRecorder(parentId);return}
 const isProfile=['card','page'].includes(type);
 const imageField=isProfile?`<label>نشانی تصویر (اختیاری)</label><input id="fieldImage" value="${esc(item?.image||'')}" placeholder="https://...">`:'';
 const optionsField=type==='dropdown'?`<label>گزینه‌های منوی کشویی (هر گزینه در یک خط)</label><textarea id="fieldOptions" placeholder="گزینه‌ی اول&#10;گزینه‌ی دوم">${esc((item?.options||[]).join('\n'))}</textarea>`:'';
 const writingField=type==='writing'?`<label>متن نوشته</label><textarea id="writingText" style="min-height:180px" placeholder="نوشته‌ی خود را وارد کنید">${esc(item?.body||'')}</textarea>`:'';
 const actionField=`<label>با کلیک روی مورد چه اتفاقی بیفتد؟</label>
 <select id="fieldAction">
 <option value="profile">باز کردن صفحه‌ی همین مورد</option>
 <option value="page">باز کردن صفحه‌ی جدید</option>
 <option value="home">رفتن به صفحه‌ی اصلی پنل</option>
 <option value="people">رفتن به افراد</option>
 <option value="employee">رفتن به بخش کارمند</option>
 <option value="none">بدون انتقال</option>
 </select>
 <div id="targetWrap"><label>عنوان صفحه‌ی جدید</label><input id="fieldTarget" value="${esc(item?.target||'')}" placeholder="نام صفحه"></div>`;
 const profileFields=isProfile?`<h2 style="margin-top:22px">اطلاعات صفحه</h2>
 <label>نام</label><input id="firstName" value="${esc(item?.info?.firstName||'')}" placeholder="نام">
 <label>نام خانوادگی</label><input id="lastName" value="${esc(item?.info?.lastName||'')}" placeholder="نام خانوادگی">
 <label>ایمیل</label><input id="email" type="email" value="${esc(item?.info?.email||'')}" placeholder="ایمیل">
 <label>شماره تلفن</label><input id="phone" value="${esc(item?.info?.phone||'')}" placeholder="شماره تلفن">
 <label>رمز عبور</label><input id="password" type="password" value="${esc(item?.info?.password||'')}" placeholder="رمز عبور">
 <label>اطلاعات بیشتر</label><textarea id="extraInfo" placeholder="اطلاعات بیشتر">${esc(item?.info?.extra||'')}</textarea>`:'';

 showModal(`<h2>${item?'ویرایش':'ساخت'} ${type==='card'?'کارت':type==='button'?'دکمه':type==='dropdown'?'دکمه‌ی کشویی':type==='page'?'صفحه‌ی جدید':'نوشته'}</h2>
 <label>عنوان اصلی</label><input id="fieldTitle" value="${esc(item?.title||'')}" placeholder="عنوان را وارد کنید">
 <label>توضیحات زیر عنوان</label><textarea id="fieldDescription" placeholder="توضیحات">${esc(item?.description||'')}</textarea>
 ${imageField}${optionsField}${writingField}${actionField}${profileFields}
 ${item&&isProfile?'<div class="editor-check"><input id="changeImage" type="checkbox"><label for="changeImage">می‌خواهم تصویر را تغییر بدهم</label></div>':''}
 <div class="modal-actions"><button class="primary" id="confirmTile">تأیید</button><button class="secondary" id="cancelEditor">انصراف</button></div>`);

 const action=$('fieldAction');
 action.value=item?.action||'profile';
 $('targetWrap').style.display=action.value==='page'?'block':'none';
 action.onchange=()=>{$('targetWrap').style.display=action.value==='page'?'block':'none'};
 $('cancelEditor').onclick=closeModal;

 $('confirmTile').onclick=()=>{
  const title=$('fieldTitle').value.trim();
  if(!title){alert('عنوان اصلی را وارد کنید.');return}
  const image=$('fieldImage')?.value.trim()||item?.image||'';
  if(item&&isProfile&&$('changeImage')?.checked&&!image){alert('نشانی تصویر جدید را وارد کنید.');return}
  const options=type==='dropdown'?$ ('fieldOptions').value.split('\n').map(x=>x.trim()).filter(Boolean):[];
  const info=isProfile?{
   firstName:$('firstName').value.trim(),
   lastName:$('lastName').value.trim(),
   email:$('email').value.trim(),
   phone:$('phone').value.trim(),
   password:$('password').value,
   extra:$('extraInfo').value.trim()
  }:item?.info||{};
  const newItem={
   id:item?.id||makeId(),type,title,
   description:$('fieldDescription').value.trim(),
   image,options,action:action.value,
   target:$('fieldTarget').value.trim(),info,
   body:type==='writing'?$('writingText').value:(item?.body||''),
   parentId:item?item.parentId:parentId
  };
  const old=[...tiles];
  if(item)tiles=tiles.map(x=>x.id===item.id?newItem:x);
  else tiles.push(newItem);
  try{saveTiles();closeModal();renderCurrent()}
  catch(e){tiles=old;alert('ذخیره‌سازی انجام نشد.')}
 };
}

function showAudioRecorder(parentId){
 showModal(`<h2>ضبط صوت جدید</h2>
 <label>عنوان ضبط</label><input id="audioTitle" placeholder="مثلاً یادداشت صوتی">
 <label>توضیحات (اختیاری)</label><textarea id="audioDescription" placeholder="توضیحات صوت"></textarea>
 <div class="recording-panel">
  <div id="recordStatus" class="empty">برای شروع، دکمه‌ی ضبط را بزنید.</div>
  <div class="recording-actions">
   <button class="record-start" id="startRecording">● شروع ضبط</button>
   <button class="record-stop" id="stopRecording" disabled>■ پایان ضبط</button>
  </div>
  <audio id="previewAudio" controls style="display:none"></audio>
 </div>
 <div class="modal-actions"><button class="primary" id="saveAudio" disabled>ذخیره‌ی صوت</button><button class="secondary" id="cancelAudio">انصراف</button></div>`);

 let localRecorder=null,localStream=null,chunks=[],audioBlob=null,previewUrl=null;
 const status=$('recordStatus'),start=$('startRecording'),stop=$('stopRecording'),save=$('saveAudio'),preview=$('previewAudio');

 $('cancelAudio').onclick=async()=>{
  if(localRecorder&&localRecorder.state==='recording')localRecorder.stop();
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  if(previewUrl)URL.revokeObjectURL(previewUrl);
  closeModal();
 };

 start.onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='ضبط صوت در این مرورگر پشتیبانی نمی‌شود.';return}
  try{
   localStream=await navigator.mediaDevices.getUserMedia({audio:true});
   const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
   localRecorder=new MediaRecorder(localStream,mime?{mimeType:mime}:{});
   chunks=[];
   localRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
   localRecorder.onstop=()=>{
    audioBlob=new Blob(chunks,{type:localRecorder.mimeType||'audio/webm'});
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    previewUrl=URL.createObjectURL(audioBlob);
    preview.src=previewUrl;preview.style.display='block';save.disabled=false;
    status.textContent='ضبط تمام شد. می‌توانید گوش کنید و ذخیره کنید.';
    localStream?.getTracks().forEach(t=>t.stop());localStream=null;
   };
   localRecorder.start();
   start.disabled=true;stop.disabled=false;save.disabled=true;
   status.textContent='در حال ضبط صدا…';
  }catch(e){status.textContent='اجازه‌ی استفاده از میکروفون داده نشد یا ضبط شروع نشد.'}
 };

 stop.onclick=()=>{
  if(localRecorder&&localRecorder.state==='recording'){localRecorder.stop();stop.disabled=true;start.disabled=false}
 };

 save.onclick=()=>{
  if(!audioBlob)return;
  const title=$('audioTitle').value.trim()||'ضبط صوت';
  const reader=new FileReader();
  reader.onload=()=>{
   try{
    const rec={id:makeId(),parentId,title,description:$('audioDescription').value.trim(),data:reader.result,createdAt:new Date().toISOString()};
    recordings.push(rec);saveRecordings();
    if(localStream)localStream.getTracks().forEach(t=>t.stop());
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    closeModal();renderCurrent();
   }catch(e){alert('ذخیره‌ی صوت انجام نشد. ممکن است حجم ضبط زیاد باشد.')}
  };
  reader.readAsDataURL(audioBlob);
 };
}

function deleteTile(id){
 if(!confirm('این مورد و تمام موارد داخل آن برای همیشه حذف شوند؟'))return;
 const old=[...tiles],oldMedia=[...recordings],ids=new Set([id]);let changed=true;
 while(changed){
  changed=false;
  tiles.forEach(t=>{if(ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);changed=true}});
 }
 tiles=tiles.filter(t=>!ids.has(t.id));
 recordings=recordings.filter(r=>!ids.has(r.parentId));
 navStack=navStack.filter(n=>!ids.has(n.tile?.id));
 if(activeTile&&ids.has(activeTile.id)){activeTile=null;currentPage='userChanges'}
 try{saveTiles();saveRecordings();renderCurrent();renderDynamicExits()}
 catch(e){tiles=old;recordings=oldMedia;alert('حذف ذخیره نشد.')}
}

function deleteRecording(id){
 if(!confirm('این ضبط صوت حذف شود؟'))return;
 const old=[...recordings];
 recordings=recordings.filter(r=>r.id!==id);
 try{saveRecordings();renderCurrent()}
 catch(e){recordings=old;alert('حذف ضبط انجام نشد.')}
}

function renderTileList(root,list){
 root.replaceChildren();
 if(!list.length){
  const empty=document.createElement('div');empty.className='empty';
  empty.textContent='هنوز موردی ساخته نشده است. برای شروع، دکمه‌ی سبز + را بزنید.';
  root.append(empty);return;
 }
 list.forEach(tile=>{
  const el=document.createElement('div');el.className='tile';el.tabIndex=0;
  const tools=document.createElement('div');tools.className='tile-tools';
  const del=document.createElement('button');del.className='tile-tool tile-delete';del.title='حذف';del.textContent='×';
  del.onclick=e=>{e.stopPropagation();deleteTile(tile.id)};
  const edit=document.createElement('button');edit.className='tile-tool tile-edit';edit.title='ویرایش';edit.textContent='✎';
  edit.onclick=e=>{e.stopPropagation();showEditor(tile.type,tile,tile.parentId)};
  tools.append(del,edit);el.append(tools);
  if(tile.image){
   const img=document.createElement('img');img.className='tile-image';img.src=tile.image;img.alt='';
   img.onerror=()=>{img.style.display='none'};el.append(img);
  }else{
   const icon=document.createElement('div');icon.className='tile-image';
   icon.textContent=tile.type==='audio'?'🎙':tile.type==='writing'?'✎':tile.type==='button'?'↗':tile.type==='dropdown'?'⌄':'▦';
   el.append(icon);
  }
  const title=document.createElement('div');title.className='tile-title';title.textContent=tile.title;el.append(title);
  if(tile.description){const desc=document.createElement('div');desc.className='tile-description';desc.textContent=tile.description;el.append(desc)}
  el.onclick=()=>activateTile(tile);
  el.onkeydown=e=>{if(e.key==='Enter')activateTile(tile)};
  root.append(el);
 });
}

function renderTiles(){renderTileList($('userTiles'),tiles.filter(t=>!t.parentId))}

function activateTile(tile){
 if(tile.action==='home'){openPage('home',true,null);return}
 if(tile.action==='people'){openPage('people',true,null);return}
 if(tile.action==='employee'){
  openPage('people',true,null);
  document.querySelector('[data-tab="employee"]').click();
  return;
 }
 if(tile.action==='none')return;

 const targetPage=
  tile.type==='audio'||tile.type==='writing'||tile.type==='dropdown'||tile.type==='button'||tile
