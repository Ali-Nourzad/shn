<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل کارمند | س.ح.ن</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: "Lalezar";
            src: url("./Lalezar-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #f5f1e8;
            --surface: rgba(255,252,245,.84);
            --surface-solid: #fffdf8;
            --text: #292722;
            --muted: #777268;
            --accent: #d77b32;
            --dark: #292824;
            --border: rgba(67,58,47,.12);
            --shadow: 0 20px 50px rgba(54,44,31,.10);
            --blue: #3e78c5;
            --red: #c94b43;
            --green: #4f8055;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(215,123,50,.10), transparent 28%),
                radial-gradient(circle at 90% 20%, rgba(255,185,0,.08), transparent 28%),
                var(--bg);
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: 0;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 82px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,252,245,.82);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(54,44,31,.08);
            backdrop-filter: blur(18px);
        }

        .brand {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 32px;
        }

        .menu-btn {
            width: 56px;
            height: 56px;
            border-radius: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: linear-gradient(145deg,#3f3a34,#211f1c);
            box-shadow:
                0 8px 20px rgba(45,35,25,.20),
                inset 0 1px 1px rgba(255,255,255,.16);
            cursor: pointer;
        }

        .menu-btn span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fffdf8;
        }

        .dropdown {
            position: fixed;
            top: 94px;
            left: 6%;
            width: 220px;
            padding: 10px;
            z-index: 1200;
            border-radius: 20px;
            background: rgba(255,252,245,.96);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: .22s;
        }

        .dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown button {
            width: 100%;
            padding: 14px;
            border-radius: 13px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            text-align: right;
        }

        .dropdown button:hover {
            background: #f1eade;
        }

        .page {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: 55px 6% 100px;
        }

        .home {
            display: block;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: clamp(38px,5vw,56px);
            margin-bottom: 9px;
        }

        .page-title p {
            color: var(--muted);
            line-height: 2;
            font-size: 14px;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 22px;
        }

        .home-card {
            min-height: 230px;
            padding: 30px;
            border-radius: 28px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            transition: .25s;
        }

        .home-card:hover {
            transform: translateY(-6px);
        }

        .home-card .icon {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            font-size: 30px;
            background: #f1e8dc;
            margin-bottom: 17px;
        }

        .home-card h2 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .home-card p {
            color: var(--muted);
            line-height: 1.9;
            font-size: 13px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .section-head h1 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 39px;
        }

        .back-btn {
            padding: 12px 17px;
            border-radius: 13px;
            background: #ebe4da;
            cursor: pointer;
            color: var(--text);
            font-size: 12px;
        }

        .manager-tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 23px;
        }

        .tool-btn {
            padding: 12px 16px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 12px;
            background: var(--dark);
            color: white;
        }

        .tool-btn.add {
            background: var(--accent);
        }

        .tool-btn.deleted {
            background: #81776b;
        }

        .cards-list {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 18px;
        }

        .managed-card {
            padding: 23px;
            border-radius: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .managed-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .managed-icon {
            width: 58px;
            height: 58px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #eee5da;
            font-size: 26px;
        }

        .managed-info {
            flex: 1;
        }

        .managed-info h3 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 25px;
            margin-bottom: 4px;
        }

        .managed-info p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .managed-code {
            display: inline-block;
            margin-top: 9px;
            padding: 5px 9px;
            border-radius: 8px;
            background: #ebe4da;
            direction: ltr;
            font-size: 10px;
        }

        .managed-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .managed-actions button {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit {
            background: var(--blue);
            color: white;
        }

        .delete {
            background: var(--red);
            color: white;
        }

        .restore {
            background: var(--green);
            color: white;
        }

        .confirm-box {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 1500;
            padding: 15px 18px;
            border-radius: 17px;
            background: #292824;
            box-shadow: 0 15px 35px rgba(0,0,0,.17);
            display: none;
            align-items: center;
            gap: 13px;
        }

        .confirm-box.show {
            display: flex;
        }

        .confirm-box span {
            color: white;
            font-size: 12px;
        }

        .confirm-box button {
            padding: 11px 15px;
            border-radius: 11px;
            background: var(--green);
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        /* PEOPLE */
        .people-wrapper {
            position: relative;
        }

        .people-sidebar {
            position: fixed;
            left: 0;
            top: 82px;
            bottom: 0;
            width: 64px;
            z-index: 900;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 22px;
            border-right: 1px solid var(--border);
            background: rgba(255,252,245,.86);
            backdrop-filter: blur(18px);
            transition: .25s;
        }

        .people-sidebar.closed {
            transform: translateX(-100%);
        }

        .people-sidebar button {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            cursor: pointer;
            background: #eee7dd;
            color: var(--text);
            font-size: 18px;
        }

        .people-content {
            padding-left: 80px;
        }

        .people-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .people-count {
            color: var(--muted);
            font-size: 15px;
        }

        .people-count strong {
            color: var(--text);
            font-size: 24px;
        }

        .add-account-btn {
            padding: 13px 17px;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 10px 22px rgba(215,123,50,.18);
        }

        .people-list {
            display: grid;
            gap: 14px;
        }

        .person-row {
            padding: 19px;
            border-radius: 21px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: 0 12px 30px rgba(54,44,31,.07);
        }

        .person-main {
            display: grid;
            grid-template-columns: 1.1fr 1fr 1fr 1.2fr auto;
            align-items: center;
            gap: 15px;
        }

        .person-name {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 23px;
        }

        .person-item {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .person-item strong {
            display: block;
            color: var(--text);
            margin-bottom: 3px;
        }

        .person-delete {
            padding: 10px 13px;
            border-radius: 11px;
            background: var(--red);
            color: white;
            cursor: pointer;
            font-size: 11px;
        }

        .empty {
            padding: 45px;
            border-radius: 24px;
            text-align: center;
            background: rgba(255,252,245,.65);
            border: 1px dashed var(--border);
            color: var(--muted);
            line-height: 2;
            font-size: 13px;
        }

        /* MODAL */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2500;
            background: rgba(28,25,21,.48);
            backdrop-filter: blur(7px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: .2s;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: min(500px,100%);
            max-height: 92vh;
            overflow-y: auto;
            padding: 28px;
            border-radius: 27px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            box-shadow: 0 35px 90px rgba(35,28,20,.23);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-head h2 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 29px;
        }

        .close {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            cursor: pointer;
            background: #eee7dd;
            font-size: 20px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
        }

        .field input {
            width: 100%;
            height: 47px;
            padding: 0 13px;
            border: 1px solid var(--border);
            background: #fffefa;
            border-radius: 13px;
            outline: none;
            font-size: 13px;
        }

        .field input:focus {
            border-color: rgba(215,123,50,.5);
            box-shadow: 0 0 0 4px rgba(215,123,50,.08);
        }

        .modal-submit {
            width: 100%;
            height: 49px;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 4px;
        }

        .modal-message {
            min-height: 22px;
            text-align: center;
            margin-top: 12px;
            color: var(--red);
            font-size: 12px;
            line-height: 1.8;
        }

        @media (max-width: 900px) {
            .person-main {
                grid-template-columns: 1fr 1fr;
            }

            .person-delete {
                width: 100%;
            }
        }

        @media (max-width: 760px) {
            .home-grid,
            .cards-list {
                grid-template-columns: 1fr;
            }

            .people-content {
                padding-left: 0;
            }

            .person-main {
                grid-template-columns: 1fr;
            }

            .people-top {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 520px) {
            .navbar {
                height: 74px;
                padding: 0 20px;
            }

            .menu-btn {
                width: 50px;
                height: 50px;
            }

            .page {
                padding: 40px 20px 100px;
            }

            .people-sidebar {
                top: 74px;
            }

            .section-head {
                flex-direction: column;
                align-items: flex-start;
            }

            .confirm-box {
                right: 15px;
                left: 15px;
                bottom: 15px;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="brand">س.ح.ن</div>

    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

<div class="dropdown" id="dropdown">
    <button onclick="logout()">↩ خروج از پنل</button>
</div>

<div class="page">

    <!-- HOME -->
    <section class="section active" id="homeSection">

        <div class="page-title">
            <h1>پنل کارمند</h1>
            <p>مدیریت بخش‌های سایت س.ح.ن</p>
        </div>

        <div class="home-grid">

            <div class="home-card" onclick="openCardsManager()">
                <div class="icon">🛠️</div>
                <h2>تغییرات صفحه کاربر</h2>
                <p>تغییر دادن صفحه کاربر</p>
            </div>

            <div class="home-card" onclick="openPeople()">
                <div class="icon">👥</div>
                <h2>دیدن افراد</h2>
                <p>مشاهده و مدیریت اکانت‌های کاربران</p>
            </div>

        </div>
    </section>

    <!-- CARD MANAGER -->
    <section class="section" id="cardsSection">

        <div class="section-head">
            <h1>تغییرات صفحه کاربر</h1>

            <button class="back-btn" onclick="goHome()">
                ↩ برگشت
            </button>
        </div>

        <div class="manager-tools">
            <button class="tool-btn add" onclick="openCardModal()">
                ＋ افزودن کارت
            </button>

            <button class="tool-btn deleted" onclick="showDeleted()">
                🗑 حذف‌شده‌ها
            </button>
        </div>

        <div class="cards-list" id="cardsList"></div>

    </section>

    <!-- PEOPLE -->
    <section class="section" id="peopleSection">

        <div class="people-wrapper">

            <aside class="people-sidebar" id="peopleSidebar">
                <button onclick="togglePeopleSidebar()">☰</button>
            </aside>

            <div class="people-content">

                <div class="section-head">
                    <h1>افراد</h1>

                    <button class="back-btn" onclick="goHome()">
                        ↩ برگشت
                    </button>
                </div>

                <div class="people-top">

                    <div class="people-count">
                        تعداد نفرات:
                        <strong id="peopleCount">0</strong>
                    </div>

                    <button class="add-account-btn"
                            onclick="openAccountModal()">
                        ＋ اضافه کردن اکانت
                    </button>

                </div>

                <div class="people-list" id="peopleList"></div>

            </div>

        </div>

    </section>

</div>

<!-- CONFIRM -->
<div class="confirm-box" id="confirmBox">
    <span>تغییرات ذخیره نشده</span>
    <button onclick="confirmChanges()">
        ✓ تأیید تغییرات
    </button>
</div>

<!-- CARD MODAL -->
<div class="overlay" id="cardOverlay">

    <div class="modal">

        <div class="modal-head">
            <h2 id="cardModalTitle">افزودن کارت</h2>
            <button class="close" onclick="closeCardModal()">×</button>
        </div>

        <div class="field">
            <label>اسم بزرگ کارت</label>
            <input id="cardTitle" type="text" placeholder="مثلاً کتابخانه">
        </div>

        <div class="field">
            <label>نوشته زیر کارت</label>
            <input id="cardDescription" type="text"
                   placeholder="توضیح کوتاه کارت">
        </div>

        <div class="field">
            <label>کد صفحه</label>
            <input id="cardCode" type="text"
                   placeholder="مثلاً library">
        </div>

        <div class="field">
            <label>آیکن کارت</label>
            <input id="cardIcon" type="text"
                   placeholder="مثلاً 📚">
        </div>

        <button class="modal-submit" onclick="saveCard()">
            ذخیره
        </button>

        <div class="modal-message" id="cardMessage"></div>

    </div>
</div>

<!-- ACCOUNT MODAL -->
<div class="overlay" id="accountOverlay">

    <div class="modal">

        <div class="modal-head">
            <h2>اضافه کردن اکانت</h2>
            <button class="close" onclick="closeAccountModal()">×</button>
        </div>

        <div class="field">
            <label>نام</label>
            <input id="accountFirstName" type="text"
                   placeholder="نام">
        </div>

        <div class="field">
            <label>نام خانوادگی</label>
            <input id="accountLastName" type="text"
                   placeholder="نام خانوادگی">
        </div>

        <div class="field">
            <label>شماره تلفن</label>
            <input id="accountPhone" type="tel"
                   placeholder="0912...">
        </div>

        <div class="field">
            <label>جیمیل</label>
            <input id="accountEmail" type="email"
                   placeholder="example@gmail.com">
        </div>

        <div class="field">
            <label>رمز عبور</label>
            <input id="accountPassword" type="password"
                   placeholder="رمز عبور">
        </div>

        <div class="field">
            <label>تکرار رمز عبور</label>
            <input id="accountPasswordRepeat" type="password"
                   placeholder="تکرار رمز عبور">
        </div>

        <button class="modal-submit"
                onclick="createAccount()">
            ساخت اکانت
        </button>

        <div class="modal-message" id="accountMessage"></div>

    </div>
</div>

<script>
    const SUPABASE_URL =
        "https://zyziyyhzxsnwzrsubulu.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_RIGsFvG_eSFBmXYAxe8UHA_JQjhVkpR";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const menuBtn = document.getElementById("menuBtn");
    const dropdown = document.getElementById("dropdown");

    let cards = [];
    let originalCards = [];
    let deletedMode = false;
    let editingCardId = null;

    menuBtn.addEventListener("click", e => {
        e.stopPropagation();
        dropdown.classList.toggle("open");
    });

    document.addEventListener("click", e => {
        if (!dropdown.contains(e.target) &&
            !menuBtn.contains(e.target)) {
            dropdown.classList.remove("open");
        }
    });

    async function init() {

        const { data: sessionData } =
            await supabaseClient.auth.getSession();

        if (!sessionData.session) {
            location.href = "index.html";
            return;
        }

        const { data: authorized, error } =
            await supabaseClient.rpc(
                "is_employee_authorized"
            );

        if (error || authorized !== true) {
            await supabaseClient.auth.signOut();
            location.href = "index.html";
            return;
        }

        await loadCards();
    }

    async function loadCards() {

        const { data, error } =
            await supabaseClient
                .from("site_cards")
                .select("*")
                .order("sort_order", {
                    ascending: true
                });

        if (error) {
            console.error(error);
            return;
        }

        cards = data || [];
        originalCards = JSON.parse(JSON.stringify(cards));

        renderCards();
    }

    function renderCards() {

        const container =
            document.getElementById("cardsList");

        const source =
            deletedMode
                ? cards.filter(x => x.is_deleted)
                : cards.filter(x => !x.is_deleted);

        if (!source.length) {
            container.innerHTML = `
                <div class="empty">
                    ${
                        deletedMode
                            ? "هیچ کارت حذف‌شده‌ای وجود ندارد."
                            : "فعلاً کارتی وجود ندارد."
                    }
                </div>
            `;
            return;
        }

        container.innerHTML =
            source.map(card => `
                <div class="managed-card">

                    <div class="managed-top">

                        <div class="managed-icon">
                            ${escapeHtml(card.icon || "📦")}
                        </div>

                        <div class="managed-info">

                            <h3>
                                ${escapeHtml(card.title || "")}
                            </h3>

                            <p>
                                ${escapeHtml(card.description || "")}
                            </p>

                            <span class="managed-code">
                                ${escapeHtml(card.code || "")}
                            </span>

                        </div>

                    </div>

                    <div class="managed-actions">

                        ${
                            deletedMode
                            ?
                            `
                            <button
                                class="restore"
                                onclick="restoreCard('${card.id}')">
                                ↶ بازگردانی
                            </button>
                            `
                            :
                            `
                            <button
                                class="edit"
                                onclick="editCard('${card.id}')">
                                ✎ ویرایش
                            </button>

                            <button
                                class="delete"
                                onclick="deleteCard('${card.id}')">
                                ✕ حذف
                            </button>
                            `
                        }

                    </div>

                </div>
            `).join("");
    }

    function openCardsManager() {

        document.getElementById("homeSection")
            .classList.remove("active");

        document.getElementById("peopleSection")
            .classList.remove("active");

        document.getElementById("cardsSection")
            .classList.add("active");

        deletedMode = false;
        renderCards();
    }

    function showDeleted() {
        deletedMode = true;
        renderCards();
    }

    function editCard(id) {

        const card = cards.find(x => x.id === id);

        if (!card) return;

        editingCardId = id;

        document.getElementById("cardModalTitle")
            .textContent = "ویرایش کارت";

        document.getElementById("cardTitle")
            .value = card.title || "";

        document.getElementById("cardDescription")
            .value = card.description || "";

        document.getElementById("cardCode")
            .value = card.code || "";

        document.getElementById("cardIcon")
            .value = card.icon || "";

        document.getElementById("cardOverlay")
            .classList.add("open");
    }

    function openCardModal() {

        editingCardId = null;

        document.getElementById("cardModalTitle")
            .textContent = "افزودن کارت";

        document.getElementById("cardTitle").value = "";
        document.getElementById("cardDescription").value = "";
        document.getElementById("cardCode").value = "";
        document.getElementById("cardIcon").value = "";
        document.getElementById("cardMessage").textContent = "";

        document.getElementById("cardOverlay")
            .classList.add("open");
    }

    function closeCardModal() {
        document.getElementById("cardOverlay")
            .classList.remove("open");
    }

    function saveCard() {

        const title =
            document.getElementById("cardTitle").value.trim();

        const description =
            document.getElementById("cardDescription").value.trim();

        const code =
            document.getElementById("cardCode").value.trim();

        const icon =
            document.getElementById("cardIcon").value.trim();

        if (!title || !description || !code || !icon) {
            document.getElementById("cardMessage")
                .textContent =
                "لطفاً همه اطلاعات کارت را وارد کنید.";
            return;
        }

        if (editingCardId) {

            const index =
                cards.findIndex(x => x.id === editingCardId);

            if (index !== -1) {

                cards[index] = {
                    ...cards[index],
                    title,
                    description,
                    code,
                    icon,
                    updated_at: new Date().toISOString()
                };
            }

        } else {

            cards.push({
                id: crypto.randomUUID(),
                title,
                description,
                code,
                icon,
                is_deleted: false,
                sort_order: cards.length + 1,
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            });
        }

        closeCardModal();
        deletedMode = false;
        renderCards();
        showConfirm();
    }

    function deleteCard(id) {

        const index =
            cards.findIndex(x => x.id === id);

        if (index === -1) return;

        cards[index].is_deleted = true;
        cards[index].updated_at =
            new Date().toISOString();

        renderCards();
        showConfirm();
    }

    function restoreCard(id) {

        const index =
            cards.findIndex(x => x.id === id);

        if (index === -1) return;

        cards[index].is_deleted = false;
        cards[index].updated_at =
            new Date().toISOString();

        deletedMode = true;

        renderCards();
        showConfirm();
    }

    function showConfirm() {

        const changed =
            JSON.stringify(cards) !==
            JSON.stringify(originalCards);

        document.getElementById("confirmBox")
            .classList.toggle("show", changed);
    }

    async function confirmChanges() {

        const button =
            document.querySelector("#confirmBox button");

        button.disabled = true;

        try {

            for (const card of cards) {

                const { error } =
                    await supabaseClient
                        .from("site_cards")
                        .upsert({
                            id: card.id,
                            title: card.title,
                            description: card.description,
                            code: card.code,
                            icon: card.icon,
                            is_deleted: card.is_deleted,
                            sort_order: card.sort_order,
                            created_at: card.created_at,
                            updated_at: new Date().toISOString()
                        });

                if (error) {
                    throw error;
                }
            }

            originalCards =
                JSON.parse(JSON.stringify(cards));

            document.getElementById("confirmBox")
                .classList.remove("show");

            alert("تغییرات با موفقیت ذخیره شد.");

            goHome();

        } catch (error) {

            console.error(error);

            alert(
                "ذخیره تغییرات انجام نشد."
            );

        } finally {
            button.disabled = false;
        }
    }

    // PEOPLE
    async function openPeople() {

        document.getElementById("homeSection")
            .classList.remove("active");

        document.getElementById("cardsSection")
            .classList.remove("active");

        document.getElementById("peopleSection")
            .classList.add("active");

        document.getElementById("peopleSidebar")
            .classList.remove("closed");

        await loadPeople();
    }

    function togglePeopleSidebar() {
        document.getElementById("peopleSidebar")
            .classList.toggle("closed");
    }

    async function loadPeople() {

        const list =
            document.getElementById("peopleList");

        list.innerHTML = `
            <div class="empty">
                در حال دریافت اطلاعات کاربران...
            </div>
        `;

        const { data, error } =
            await supabaseClient.functions.invoke(
                "manage-users",
                {
                    body: {
                        action: "list"
                    }
                }
            );

        if (error) {
            console.error(error);

            list.innerHTML = `
                <div class="empty">
                    دریافت اطلاعات کاربران انجام نشد.
                </div>
            `;

            return;
        }

        const users = data?.users || [];

        document.getElementById("peopleCount")
            .textContent = users.length;

        if (!users.length) {

            list.innerHTML = `
                <div class="empty">
                    هنوز هیچ اکانت کاربری ساخته نشده است.
                    <br>
                    از گزینه «＋ اضافه کردن اکانت» استفاده کنید.
                </div>
            `;

            return;
        }

        list.innerHTML = users.map(user => {

            const fullName =
                `${user.first_name || ""} ${user.last_name || ""}`.trim()
                || "بدون نام";

            return `
                <div class="person-row">

                    <div class="person-main">

                        <div class="person-name">
                            ${escapeHtml(fullName)}
                        </div>

                        <div class="person-item">
                            <strong>شماره تلفن</strong>
                            ${escapeHtml(user.phone || "-")}
                        </div>

                        <div class="person-item">
                            <strong>جیمیل</strong>
                            ${escapeHtml(user.email || "-")}
                        </div>

                        <div class="person-item">
                            <strong>شناسه</strong>
                            <span dir="ltr">
                                ${escapeHtml(user.id || "-")}
                            </span>
                        </div>

                        <button
                            class="person-delete"
                            onclick="deleteAccount('${user.id}')">
                            حذف
                        </button>

                    </div>

                </div>
            `;
        }).join("");
    }

    function openAccountModal() {

        [
            "accountFirstName",
            "accountLastName",
            "accountPhone",
            "accountEmail",
            "accountPassword",
            "accountPasswordRepeat"
        ].forEach(id => {
            document.getElementById(id).value = "";
        });

        document.getElementById("accountMessage")
            .textContent = "";

        document.getElementById("accountOverlay")
            .classList.add("open");
    }

    function closeAccountModal() {
        document.getElementById("accountOverlay")
            .classList.remove("open");
    }

    async function createAccount() {

        const firstName =
            document.getElementById("accountFirstName")
                .value.trim();

        const lastName =
            document.getElementById("accountLastName")
                .value.trim();

        const phone =
            document.getElementById("accountPhone")
                .value.trim();

        const email =
            document.getElementById("accountEmail")
                .value.trim();

        const password =
            document.getElementById("accountPassword")
                .value;

        const repeatPassword =
            document.getElementById("accountPasswordRepeat")
                .value;

        const message =
            document.getElementById("accountMessage");

        message.textContent = "";

        if (
            !firstName ||
            !lastName ||
            !phone ||
            !email ||
            !password ||
            !repeatPassword
        ) {
            message.textContent =
                "لطفاً همه اطلاعات را وارد کنید.";
            return;
        }

        if (password !== repeatPassword) {
            message.textContent =
                "رمز عبور و تکرار آن یکسان نیست.";
            return;
        }

        if (password.length < 6) {
            message.textContent =
                "رمز عبور باید حداقل ۶ کاراکتر باشد.";
            return;
        }

        const { error } =
            await supabaseClient.functions.invoke(
                "manage-users",
                {
                    body: {
                        action: "create",
                        first_name: firstName,
                        last_name: lastName,
                        phone,
                        email,
                        password
                    }
                }
            );

        if (error) {
            console.error(error);

            message.textContent =
                "ساخت اکانت انجام نشد.";
            return;
        }

        message.style.color = "var(--green)";
        message.textContent =
            "اکانت با موفقیت ساخته شد.";

        await loadPeople();

        setTimeout(() => {
            closeAccountModal();
        }, 700);
    }

    async function deleteAccount(id) {

        const ok =
            confirm("آیا از حذف این اکانت مطمئن هستید؟");

        if (!ok) return;

        const { error } =
            await supabaseClient.functions.invoke(
                "manage-users",
                {
                    body: {
                        action: "delete",
                        user_id: id
                    }
                }
            );

        if (error) {
            console.error(error);
            alert("حذف اکانت انجام نشد.");
            return;
        }

        await loadPeople();
    }

    function goHome() {

        document.querySelectorAll(".section")
            .forEach(x => x.classList.remove("active"));

        document.getElementById("homeSection")
            .classList.add("active");
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        location.href = "index.html";
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    document.getElementById("cardOverlay")
        .addEventListener("click", e => {
            if (e.target.id === "cardOverlay") {
                closeCardModal();
            }
        });

    document.getElementById("accountOverlay")
        .addEventListener("click", e => {
            if (e.target.id === "accountOverlay") {
                closeAccountModal();
            }
        });

    init();
</script>

</body>
</html>
