<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل | س.ح.ن</title>
<style>
:root{
 --accent:#8b5cf6;
 --soft:rgba(139,92,246,.15);
 --bg:#10121b;
 --card:#1b1e2b;
 --text:#f5f5fa;
 --muted:#a7a9bd;
 --border:#343749;
 --green:#35d399;
 --blue:#2997ff;
 --red:#ff4d5e;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--text);
 background:radial-gradient(ellipse at 85% 0%,var(--soft),transparent 42%),var(--bg);
 font-family:Tahoma,Arial,sans-serif;transition:background .2s
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
 min-height:76px;padding:12px 6%;display:flex;align-items:center;
 justify-content:space-between;gap:15px;border-bottom:1px solid var(--border)
}
.brand{display:flex;align-items:center;gap:12px;font-weight:bold}
.logo{background:var(--accent);color:white;border-radius:13px;padding:12px;font-size:15px}
.brand small{display:block;color:var(--muted);font-weight:normal;margin-top:5px}
.header-actions{display:flex;align-items:center;gap:9px}
.menu-wrap{position:relative}
.menu-button{
 width:45px;height:43px;border:1px solid var(--border);
 border-radius:13px;background:var(--card);color:white;font-size:25px
}
.dropdown{
 display:none;position:absolute;left:0;top:52px;width:min(330px,88vw);
 background:var(--card);border:1px solid var(--border);border-radius:15px;
 padding:9px;z-index:50;box-shadow:0 15px 40px #0007;
 max-height:78vh;overflow:auto
}
.dropdown.open{display:block}
.menu-item{
 display:flex;align-items:center;gap:7px;padding:5px;margin:3px 0;
 border-radius:10px;border:1px solid transparent
}
.menu-item:hover{border-color:var(--border);background:var(--soft)}
.menu-action{
 flex:1;min-width:0;text-align:right;padding:10px 7px;border:0;
 border-radius:8px;background:transparent;color:var(--text);font-size:13px;
 overflow-wrap:anywhere
}
.menu-tools{display:flex;gap:5px;flex-shrink:0}
.menu-tool{
 width:29px;height:29px;border-radius:50%;display:grid;place-items:center;
 padding:0;background:transparent;font-size:17px
}
.menu-delete{color:var(--red);border:1px solid var(--red);background:rgba(255,77,94,.1)}
.menu-edit{color:var(--blue);border:1px solid var(--blue);background:rgba(41,151,255,.1)}
.palette{display:none;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px 7px}
.palette.open{display:grid}
.swatch{height:32px;border:2px solid #ffffff50;border-radius:8px}
.shades{display:none;flex-wrap:wrap;gap:5px;padding:0 7px 10px}
.shades.open{display:flex}
.shade{flex:1;min-width:30px;height:27px;border:1px solid #ffffff55;border-radius:6px}
.menu-separator{height:1px;background:var(--border);margin:7px 3px}
main{max-width:1000px;margin:auto;padding:38px 22px}
.page{display:none}
.page.active{display:block}
h1{font-size:27px;margin:0 0 12px}
.subtitle{font-size:14px;line-height:2;color:var(--muted);margin-bottom:30px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.home-card{
 display:block;width:100%;min-height:185px;text-align:right;padding:25px;
 border-radius:20px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);
 border:1px solid var(--border);color:var(--text);transition:.2s
}
.home-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card-icon{
 width:48px;height:48px;display:grid;place-items:center;border-radius:15px;
 background:var(--soft);color:var(--accent);font-size:24px;margin-bottom:20px
}
.home-card h2{font-size:18px;margin:0 0 10px}
.home-card p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.back{
 background:transparent;color:var(--muted);border:1px solid var(--border);
 border-radius:10px;padding:9px 14px;margin-bottom:25px
}
.back:hover{border-color:var(--accent);color:var(--text)}
.tabs{display:flex;gap:9px;margin:25px 0 20px}
.tab{padding:11px 22px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.tab.active{background:var(--accent);border-color:var(--accent);color:white}
.panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 17px}
label{display:block;font-size:13px;color:var(--muted);margin:13px 0 8px}
input,textarea,select{
 width:100%;padding:13px;border-radius:10px;background:var(--bg);
 border:1px solid var(--border);color:var(--text);outline:none
}
textarea{min-height:85px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.primary{background:var(--accent);color:white;border:0;border-radius:10px;padding:12px 18px;margin-top:12px}
.secondary{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 15px;margin-top:12px}
.message{font-size:13px;margin-top:12px;line-height:1.9}
.success{color:#5ee0a0}.error{color:#ff7b8b}
.code-list{display:grid;gap:10px;margin-top:18px}
.code-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:11px}
.code-text{overflow-wrap:anywhere;word-break:break-word}
.code-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.delete{background:#632c3a;color:#ffb8c3;border:0;border-radius:8px;padding:8px 12px}
.copy{background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.empty{color:var(--muted);font-size:13px;line-height:2}
.builder-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}
.add-round,.page-add{
 width:52px;height:52px;border-radius:50%;border:1px solid var(--green);
 background:rgba(53,211,153,.12);color:var(--green);font-size:29px;
 display:grid;place-items:center;flex-shrink:0
}
.add-round:hover,.page-add:hover{background:rgba(53,211,153,.22)}
.tile-grid,.inner-tile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:18px}
.tile{
 position:relative;min-height:185px;text-align:right;padding:23px;
 border-radius:20px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);
 border:1px solid var(--border);color:var(--text);transition:.2s;overflow:hidden
}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile-tools{position:absolute;top:10px;left:10px;display:flex;gap:7px;z-index:3}
.tile-tool{
 width:34px;height:34px;border-radius:50%;font-size:20px;padding:0;
 display:grid;place-items:center;background:var(--card)
}
.tile-delete{color:var(--red);background:rgba(255,77,94,.12);border:1px solid var(--red)}
.tile-edit{color:var(--blue);background:rgba(41,151,255,.12);border:1px solid var(--blue)}
.tile-image{width:62px;height:62px;object-fit:cover;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:26px;margin-bottom:15px}
.tile-title{font-weight:bold;font-size:17px;margin-bottom:9px;overflow-wrap:anywhere}
.tile-description{font-size:13px;color:var(--muted);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.modal-bg{
 display:none;position:fixed;inset:0;background:#000a;z-index:100;
 align-items:center;justify-content:center;padding:18px
}
.modal-bg.open{display:flex}
.modal{
 width:min(580px,100%);max-height:90vh;overflow:auto;background:var(--card);
 border:1px solid var(--border);border-radius:20px;padding:23px;box-shadow:0 20px 70px #0008
}
.modal h2{margin:0 0 10px;font-size:19px}
.modal p{color:var(--muted);font-size:13px;line-height:1.9}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.type-option{
 display:block;width:100%;padding:15px;margin:8px 0;text-align:right;
 border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)
}
.type-option:hover{border-color:var(--accent)}
.profile-head{
 display:flex;gap:18px;align-items:center;padding:22px;border:1px solid var(--border);
 border-radius:18px;background:linear-gradient(145deg,var(--soft),transparent 80%),var(--card);margin-bottom:18px
}
.profile-avatar{width:82px;height:82px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);background:var(--soft);display:grid;place-items:center;font-size:32px;flex-shrink:0}
.profile-head h2{margin:0 0 7px}
.profile-head p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
.detail-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.detail{padding:14px;border:1px solid var(--border);background:var(--bg);border-radius:12px;min-width:0}
.detail span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
.detail strong{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.content-button{width:100%;text-align:right;padding:15px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);margin:7px 0}
.content-button:hover{border-color:var(--accent)}
.drop-options{display:none;margin:4px 0 12px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:12px}
.drop-options.open{display:block}
.drop-options button{display:block;width:100%;padding:11px;text-align:right;border:0;border-radius:8px;background:transparent;color:var(--text)}
.drop-options button:hover{background:var(--soft)}
.page-tools{display:flex;justify-content:flex-end;margin-bottom:14px}
.page-add{width:46px;height:46px;font-size:25px}
.editor-check{display:flex;align-items:center;gap:9px;line-height:1.8}
.editor-check label{margin:8px 0}
.editor-check input{width:auto}
.recording-panel{border:1px solid var(--border);background:var(--bg);padding:15px;border-radius:13px;margin:12px 0}
.recording-panel audio{width:100%;margin-top:10px}
.recording-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.recording-actions button{padding:9px 12px;border-radius:9px}
.record-start{background:rgba(255,77,94,.13);border:1px solid var(--red);color:#ff9ba5}
.record-stop{background:var(--soft);border:1px solid var(--border);color:var(--text)}
.note-item{padding:15px;border:1px solid var(--border);border-radius:12px;background:var(--bg);margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.note-item audio{width:100%;margin-top:12px}
.note-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.note-head strong{font-size:14px}
.small-delete{border:1px solid var(--red);background:rgba(255,77,94,.12);color:#ff929d;border-radius:8px;padding:6px 10px}
footer{text-align:center;color:var(--muted);font-size:11px;padding:25px}
@media(max-width:500px){
 header{padding:12px 17px}main{padding:28px 16px}h1{font-size:24px}
 .code-item{align-items:flex-start;flex-direction:column}
 .code-actions{align-self:flex-end}.profile-head{align-items:flex-start}
 .tile-grid,.inner-tile-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
 <div class="brand">
  <div class="logo">س.ح.ن</div>
  <div>پنل<small>مدیریت</small></div>
 </div>
 <div class="header-actions">
  <button class="add-round" id="addMenuItem" aria-label="افزودن گزینه به منو" title="افزودن گزینه">＋</button>
  <div class="menu-wrap">
   <button class="menu-button" id="menuBtn" aria-label="منو">•••</button>
   <div class="dropdown" id="menu">
    <div id="menuItems"></div>
    <div class="menu-separator"></div>
    <div class="palette" id="palette"></div>
    <div class="shades" id="shades"></div>
    <div class="menu-separator"></div>
    <div id="dynamicExitOptions"></div>
    <button class="menu-action" id="exitPageBtn">خروج از صفحه‌ی فعلی</button>
    <button class="menu-action" id="exitPeopleBtn">خروج از افراد</button>
    <button class="menu-action" id="exitPanelBtn">خروج از پنل</button>
   </div>
  </div>
 </div>
</header>

<main>
 <section id="home" class="page active">
  <h1>خوش آمدید</h1>
  <div class="subtitle">به پنل مدیریت س.ح.ن خوش آمدید.</div>
  <div class="home-grid">
   <button class="home-card" data-open="people"><div class="card-icon">♙</div><h2>افراد</h2><p>مدیریت بخش کاربران و کارکنان</p></button>
   <button class="home-card" data-open="userChanges"><div class="card-icon">✎</div><h2>تغییرات صفحه‌ی کاربر</h2><p>ساخت و مدیریت کارت‌ها، نوشته‌ها و صوت‌ها</p></button>
  </div>
 </section>

 <section id="people" class="page">
  <button class="back" data-open="home">← بازگشت به پنل</button>
  <h1>افراد</h1><div class="subtitle">بخش موردنظر را انتخاب کنید.</div>
  <div class="tabs">
   <button class="tab active" data-tab="user">کاربر</button>
   <button class="tab" data-tab="employee">کارمند</button>
  </div>
  <div id="userSection" class="panel">
   <div class="empty">صفحه‌ی کاربر</div>
   <button class="primary" data-open="userChanges">مدیریت صفحه‌ی کاربر</button>
  </div>
  <div id="employeeSection" class="panel" style="display:none">
   <button class="primary" id="showAddForm">＋ افزودن / ساختن کد</button>
   <form id="employeeForm" style="display:none">
    <h2 style="margin-top:24px">ساخت کد کارمند</h2>
    <label for="code1">کد کارمند</label><input id="code1" autocomplete="off" required>
    <button class="primary" type="submit">ثبت کد</button>
    <button class="secondary" type="button" id="cancelAdd">انصراف</button>
    <div id="formMessage" class="message" aria-live="polite"></div>
   </form>
   <h2 style="margin-top:28px">کدهای کارمندان</h2>
   <div id="codeList" class="code-list"></div>
  </div>
 </section>

 <section id="userChanges" class="page">
  <button class="back" data-open="home">← بازگشت به پنل</button>
  <div class="builder-head">
   <div><h1>تغییرات صفحه‌ی کاربر</h1><div class="subtitle" style="margin:0">ساخت و مدیریت کارت‌ها، نوشته‌ها و صوت‌ها</div></div>
   <button class="add-round" id="addRoot" aria-label="افزودن">＋</button>
  </div>
  <div id="userTiles" class="tile-grid"></div>
 </section>

 <section id="contentPage" class="page">
  <div class="page-tools"><button class="page-add" id="addInside" aria-label="افزودن مورد جدید">＋</button></div>
  <button class="back" id="contentBack">← بازگشت</button>
  <div id="contentArea"></div>
 </section>

 <section id="profilePage" class="page">
  <div class="page-tools"><button class="page-add" id="addProfileInside" aria-label="افزودن مورد جدید">＋</button></div>
  <button class="back" id="profileBack">← بازگشت</button>
  <div id="profileArea"></div>
 </section>
</main>

<footer>س.ح.ن · پنل مدیریت</footer>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
'use strict';

const $=id=>document.getElementById(id);
const DB_KEY='shn_user_page_tiles';
const MEDIA_KEY='shn_page_media_v1';
const MENU_KEY='shn_custom_menu_items';
const THEME_KEY='shn_panel_theme';
const COLORS=['#8b5cf6','#2997ff','#35d399','#ff4d5e','#f59e0b','#ec4899','#14b8a6','#6478ff'];

let currentPage='home';
let navStack=[];
let activeTile=null;
let tiles=readArray(DB_KEY);
let recordings=readArray(MEDIA_KEY);
let customMenuItems=readArray(MENU_KEY);
let codes=readArray('employeeCodes').filter(x=>typeof x==='string');
let currentPaletteColor=null;
let selectedColor=localStorage.getItem(THEME_KEY)||'#8b5cf6';

function readArray(key){
 try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value:[]}
 catch(e){return []}
}
function saveTiles(){localStorage.setItem(DB_KEY,JSON.stringify(tiles))}
function saveRecordings(){localStorage.setItem(MEDIA_KEY,JSON.stringify(recordings))}
function saveMenuItems(){localStorage.setItem(MENU_KEY,JSON.stringify(customMenuItems))}
function saveCodes(){localStorage.setItem('employeeCodes',JSON.stringify(codes))}
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function childrenOf(id){return tiles.filter(t=>t.parentId===id)}
function mediaOf(id){return recordings.filter(r=>r.parentId===id)}
function pageLabel(name){
 if(name==='home')return 'پنل';
 if(name==='people')return 'افراد';
 if(name==='userChanges')return 'تغییرات صفحه‌ی کاربر';
 return activeTile?.title||'صفحه';
}
function pageForTile(tile){
 return ['writing','audio','dropdown','button'].includes(tile.type)?'contentPage':'profilePage';
}
function applyTheme(color){
 if(!COLORS.includes(color)&&!/^#[0-9a-f]{6}$/i.test(color))return;
 selectedColor=color;
 const r=parseInt(color.slice(1,3),16),g=parseInt(color.slice(3,5),16),b=parseInt(color.slice(5,7),16);
 document.documentElement.style.setProperty('--accent',color);
 document.documentElement.style.setProperty('--soft',`rgba(${r},${g},${b},.15)`);
 localStorage.setItem(THEME_KEY,color);
 $('shades').classList.remove('open');
 $('palette').classList.remove('open');
}
applyTheme(selectedColor);

function openPage(name,push=true,nextTile=activeTile){
 if(push&&currentPage!==name)navStack.push({page:currentPage,tile:activeTile});
 currentPage=name;
 activeTile=nextTile||null;
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===name));
 $('menu').classList.remove('open');
 $('exitPageBtn').textContent='خروج از '+pageLabel(name);
 $('exitPeopleBtn').style.display=['home','people'].includes(name)?'none':'block';
 renderDynamicExits();
 renderCurrent();
 window.scrollTo(0,0);
}
function goBack(){
 const previous=navStack.pop();
 if(previous){openPage(previous.page,false,previous.tile)}
 else{navStack=[];openPage('userChanges',false,null)}
}
function exitToTile(id){
 const tile=tiles.find(t=>t.id===id);
 if(!tile)return;
 const index=navStack.findIndex(n=>n.tile?.id===id);
 if(index>=0)navStack=navStack.slice(0,index);
 if(tile.parentId){
  const parent=tiles.find(t=>t.id===tile.parentId);
  if(parent){openPage(pageForTile(parent),false,parent);return}
 }
 openPage('userChanges',false,null);
}

/* گزینه‌های خروج تنها در شاخه‌ی جاری و تا زمانی که داخل آن شاخه هستیم دیده می‌شوند. */
function getActiveBranch(){
 const branch=[],seen=new Set();
 let node=activeTile;
 while(node&&!seen.has(node.id)){
  seen.add(node.id);
  branch.unshift(node);
  node=node.parentId?tiles.find(t=>t.id===node.parentId):null;
 }
 return branch;
}
function renderDynamicExits(){
 const root=$('dynamicExitOptions');
 root.replaceChildren();
 if(!activeTile||['home','people','userChanges'].includes(currentPage))return;
 getActiveBranch().forEach(tile=>{
  const button=document.createElement('button');
  button.className='menu-action';
  button.textContent='↩ خروج از '+tile.title;
  button.onclick=()=>{ $('menu').classList.remove('open');exitToTile(tile.id) };
  root.append(button);
 });
}

function defaultMenuItems(){
 return [
  {id:'builtin-color',title:'🎨 انتخاب رنگ',kind:'color',target:'user'},
  {id:'builtin-support',title:'تماس با پشتیبانی',kind:'support',target:'user'},
  {id:'builtin-message',title:'پیام به پشتیبانی',kind:'message',target:'user'}
 ];
}
function getAllMenuItems(){
 const defaults=defaultMenuItems().map(item=>{
  const override=customMenuItems.find(x=>x.id===item.id);
  return override?{...item,...override,builtin:true}: {...item,builtin:true};
 });
 return defaults.concat(customMenuItems.filter(x=>!x.builtin&&!['builtin-color','builtin-support','builtin-message'].includes(x.id)));
}
function renderMenuItems(){
 const root=$('menuItems');
 root.replaceChildren();
 getAllMenuItems().forEach(item=>{
  const row=document.createElement('div');row.className='menu-item';
  const action=document.createElement('button');action.className='menu-action';action.textContent=item.title;
  action.onclick=()=>activateMenuItem(item);
  const tools=document.createElement('div');tools.className='menu-tools';
  const edit=document.createElement('button');edit.className='menu-tool menu-edit';edit.title='ویرایش';edit.setAttribute('aria-label','ویرایش '+item.title);edit.textContent='✎';
  edit.onclick=e=>{e.stopPropagation();showMenuEditor(item)};
  const del=document.createElement('button');del.className='menu-tool menu-delete';del.title='حذف';del.setAttribute('aria-label','حذف '+item.title);del.textContent='×';
  del.onclick=e=>{e.stopPropagation();deleteMenuItem(item)};
  tools.append(edit,del);row.append(action,tools);root.append(row);
 });
}
function activateMenuItem(item){
 if(item.kind==='color'){
  $('palette').classList.toggle('open');
  $('shades').classList.remove('open');
  return;
 }
 if(item.kind==='support'){

function renderShades(color){
 const root=$('shades');root.replaceChildren();root.classList.add('open');
 const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));
 [0.25,0.4,0.55,0.7,0.85,1].forEach(amount=>{
  const shade=rgb.map(v=>Math.round(v*amount+255*(1-amount)));
  const hex='#'+shade.map(v=>v.toString(16).padStart(2,'0')).join('');
  const button=document.createElement('button');button.className='shade';button.style.background=hex;
  button.title='انتخاب این طیف';
  button.onclick=()=>applyTheme(hex);
  root.append(button);
 });
}

function showAudioRecorder(parentId){
 showModal(`
  <h2>ضبط صوت جدید</h2>
  <label>عنوان ضبط</label><input id="audioTitle" placeholder="مثلاً یادداشت صوتی">
  <label>توضیحات (اختیاری)</label><textarea id="audioDescription" placeholder="توضیحات صوت"></textarea>
  <div class="recording-panel">
   <div id="recordStatus" class="empty">برای شروع، دکمه‌ی ضبط را بزنید.</div>
   <div class="recording-actions">
    <button class="record-start" id="startRecording">● شروع ضبط</button>
    <button class="record-stop" id="stopRecording" disabled>■ پایان ضبط</button>
   </div>
   <audio id="previewAudio" controls style="display:none"></audio>
  </div>
  <div class="modal-actions"><button class="primary" id="saveAudio" disabled>ذخیره‌ی صوت</button><button class="secondary" id="cancelAudio">انصراف</button></div>`);
 let localRecorder=null,localStream=null,chunks=[],audioBlob=null,previewUrl=null;
 const status=$('recordStatus'),start=$('startRecording'),stop=$('stopRecording'),save=$('saveAudio'),preview=$('previewAudio');
 $('cancelAudio').onclick=()=>{
  if(localRecorder&&localRecorder.state==='recording')localRecorder.stop();
  if(localStream)localStream.getTracks().forEach(t=>t.stop());
  if(previewUrl)URL.revokeObjectURL(previewUrl);
  closeModal();
 };
 start.onclick=async()=>{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='ضبط صوت در این مرورگر پشتیبانی نمی‌شود.';return}
  try{
   localStream=await navigator.mediaDevices.getUserMedia({audio:true});
   const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));
   localRecorder=new MediaRecorder(localStream,mime?{mimeType:mime}:{});
   chunks=[];
   localRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
   localRecorder.onstop=()=>{
    audioBlob=new Blob(chunks,{type:localRecorder.mimeType||'audio/webm'});
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    previewUrl=URL.createObjectURL(audioBlob);preview.src=previewUrl;preview.style.display='block';
    save.disabled=false;status.textContent='ضبط تمام شد. می‌توانید گوش کنید و ذخیره کنید.';
    localStream?.getTracks().forEach(t=>t.stop());localStream=null;
   };
   localRecorder.start();start.disabled=true;stop.disabled=false;save.disabled=true;
   status.textContent='در حال ضبط صدا…';
  }catch(e){status.textContent='اجازه‌ی استفاده از میکروفون داده نشد یا ضبط شروع نشد.'}
 };
 stop.onclick=()=>{
  if(localRecorder&&localRecorder.state==='recording'){localRecorder.stop();stop.disabled=true;start.disabled=false}
 };
 save.onclick=()=>{
  if(!audioBlob)return;
  const title=$('audioTitle').value.trim()||'ضبط صوت';
  const reader=new FileReader();
  reader.onload=()=>{
   try{
    recordings.push({id:makeId(),parentId,title,description:$('audioDescription').value.trim(),data:reader.result,createdAt:new Date().toISOString()});
    saveRecordings();
    if(localStream)localStream.getTracks().forEach(t=>t.stop());
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    closeModal();renderCurrent();
   }catch(e){alert('ذخیره‌ی صوت انجام نشد. ممکن است حجم ضبط زیاد باشد.')}
  };
  reader.readAsDataURL(audioBlob);
 };
}

  del.onclick=e=>{e.stopPropagation();deleteTile(tile.id)};
  const edit=document.createElement('button');edit.className='tile-tool tile-edit';edit.title='ویرایش';edit.textContent='✎';
  edit.setAttribute('aria-label','ویرایش '+tile.title);
  edit.onclick=e=>{
   e.stopPropagation();
   if(tile.quickOption)showQuickEditor(tile);
   else showEditor(tile.type,tile,tile.parentId);
  };
  tools.append(del,edit);el.append(tools);
  if(tile.image){
   const img=document.createElement('img');img.className='tile-image';img.src=tile.image;img.alt='';
   img.onerror=()=>{img.style.display='none'};el.append(img);
  }else{
   const icon=document.createElement('div');icon.className='tile-image';
   icon.textContent=tile.type==='audio'?'🎙':tile.type==='writing'?'✎':tile.type==='button'?'↗':tile.type==='dropdown'?'⌄':'▦';
   el.append(icon);
  }
  const title=document.createElement('div');title.className='tile-title';title.textContent=tile.title;el.append(title);
  if(tile.description){const desc=document.createElement('div');desc.className='tile-description';desc.textContent=tile.description;el.append(desc)}
  el.onclick=()=>activateTile(tile);
  el.onkeydown=e=>{if(e.key==='Enter')activateTile(tile)};
  root.append(el);
 });
}
function renderTiles(){renderTileList($('userTiles'),tiles.filter(t=>!t.parentId))}
function renderCurrent(){
 if(currentPage==='userChanges')renderTiles();
 if(currentPage==='contentPage')renderContentPage();
 if(currentPage==='profilePage')renderProfilePage();
 renderDynamicExits();
}
function renderContentPage(){
 const root=$('contentArea');root.replaceChildren();
 if(!activeTile){openPage('userChanges',false,null);return}
 const h=document.createElement('h1');h.textContent=activeTile.title;root.append(h);
 if(activeTile.description){const sub=document.createElement('div');sub.className='subtitle';sub.textContent=activeTile.description;root.append(sub)}
 if(activeTile.type==='writing'&&activeTile.body){
  const note=document.createElement('div');note.className='note-item';note.textContent=activeTile.body;root.append(note);
 }
 if(activeTile.type==='dropdown'){
  const drop=document.createElement('div');drop.className='drop-options open';
  (activeTile.options||[]).forEach(option=>{
   const button=document.createElement('button');button.textContent=option;
   button.onclick=()=>{const note=document.createElement('div');note.className='note-item';note.textContent=option;root.append(note)};
   drop.append(button);
  });
  root.append(drop);
 }
 const childRoot=document.createElement('div');childRoot.className='inner-tile-grid';
 renderTileList(childRoot,childrenOf(activeTile.id));root.append(childRoot);
 renderRecordings(root,activeTile.id);
}
function renderProfilePage(){
 const root=$('profileArea');root.replaceChildren();
 if(!activeTile){openPage('userChanges',false,null);return}
 const head=document.createElement('div');head.className='profile-head';
 if(activeTile.image){
  const img=document.createElement('img');img.className='profile-avatar';img.src=activeTile.image;img.alt='';
  img.onerror=()=>{img.style.display='none'};head.append(img);
 }else{
  const avatar=document.createElement('div');avatar.className='profile-avatar';avatar.textContent='▦';head.append(avatar);
 }
 const intro=document.createElement('div');const h=document.createElement('h2');h.textContent=activeTile.title;intro.append(h);
 const p=document.createElement('p');p.textContent=activeTile.description||'';intro.append(p);head.append(intro);root.append(head);
 const info=activeTile.info||{};
 const entries=[['نام',info.firstName],['نام خانوادگی',info.lastName],['ایمیل',info.email],['شماره تلفن',info.phone],['اطلاعات بیشتر',info.extra]];
 const details=document.createElement('div');details.className='detail-list';
 entries.forEach(([label,value])=>{
  if(!value)return;
  const item=document.createElement('div');item.className='detail';
  const span=document.createElement('span');span.textContent=label;
  const strong=document.createElement('strong');strong.textContent=value;
  item.append(span,strong);details.append(item);
 });
 if(details.children.length)root.append(details);
 if(activeTile.body){const note=document.createElement('div');note.className='note-item';note.textContent=activeTile.body;root.append(note)}
 const childRoot=document.createElement('div');childRoot.className='inner-tile-grid';
 renderTileList(childRoot,childrenOf(activeTile.id));root.append(childRoot);
 renderRecordings(root,activeTile.id);
}
function renderRecordings(root,parentId){
 const list=mediaOf(parentId);
 if(!list.length)return;
 const heading=document.createElement('h2');heading.textContent='ضبط‌های صوتی';heading.style.marginTop='25px';root.append(heading);
 list.forEach(rec=>{
  const item=document.createElement('div');item.className='note-item';
  const head=document.createElement('div');head.className='note-head';
  const title=document.createElement('strong');title.textContent=rec.title;
  const del=document.createElement('button');del.className='small-delete';del.textContent='حذف';
  del.onclick=()=>deleteRecording(rec.id);
  head.append(title,del);item.append(head);
  if(rec.description){const desc=document.createElement('div');desc.textContent=rec.description;item.append(desc)}
  const audio=document.createElement('audio');audio.controls=true;audio.src=rec.data;item.append(audio);root.append(item);
 });
}

function activateTile(tile){
 if(tile.action==='home'){openPage('home',true,null);return}
 if(tile.action==='people'){openPage('people',true,null);return}
 if(tile.action==='employee'){
  openPage('people',true,null);
  document.querySelector('[data-tab="employee"]').click();return;
 }
 if(tile.action==='none')return;
 if(tile.action==='page'){
  openPage('contentPage',true,tile);
  return;
 }
 if(tile.type==='button'&&tile.target){
  if(tile.target==='user'){openPage('people',true,null);return}
  if(tile.target==='employee'){
   openPage('people',true,null);document.querySelector('[data-tab="employee"]').click();return;
  }
  if(tile.target==='input'){openPage('userChanges',true,null);return}
 }
 openPage(pageForTile(tile),true,tile);
}
</script>
</body>
</html>
