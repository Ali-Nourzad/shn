<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت</title>
<style>
:root{--accent:#8b5cf6;--soft:rgba(139,92,246,.15);--bg:#10121b;--card:#1b1e2b;--text:#f5f5fa;--muted:#a7a9bd;--border:#343749;--green:#35d399;--blue:#2997ff;--red:#ff4d5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.brand{font-size:20px;font-weight:bold}
.header-actions{display:flex;align-items:center;gap:9px}
.icon-btn,.add-menu-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px}
.icon-btn{color:var(--text);background:var(--card);border:1px solid var(--border)}
.add-menu-btn{display:none;color:var(--green);background:rgba(53,211,153,.12);border:1px solid var(--green);font-size:28px}
.add-menu-btn.visible{display:flex}
.page-title{font-size:25px;margin:12px 0}
.subtitle{color:var(--muted);line-height:1.9;margin:8px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;min-height:135px;display:flex;flex-direction:column;gap:12px}
.tile:hover{border-color:var(--accent)}
.tile-main{cursor:pointer;flex:1}
.tile-icon{font-size:27px;margin-bottom:8px}
.tile-title{font-weight:bold;line-height:1.8;overflow-wrap:anywhere}
.tile-description{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8}
.tile-tools,.menu-tools{display:flex;gap:7px;align-items:center}
.tool-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid;font-size:16px;flex-shrink:0}
.delete-btn{color:var(--red);border-color:var(--red);background:rgba(255,77,94,.1)}
.edit-btn{color:var(--blue);border-color:var(--blue);background:rgba(41,151,255,.1)}
.section{margin-top:25px}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.section-heading h2{font-size:18px;margin:0}
.primary-btn,.secondary-btn,.tab-btn{border-radius:10px;padding:10px 14px;border:1px solid var(--border);background:var(--card);color:var(--text)}
.primary-btn{background:var(--accent);border-color:var(--accent);color:white}
.secondary-btn:hover,.tab-btn.active{border-color:var(--accent);background:var(--soft)}
.top-add{display:none;background:var(--soft);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:9px 13px}
.top-add.visible{display:inline-flex}
.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
.panel{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:17px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px;border-radius:9px;background:var(--bg);color:var(--text);border:1px solid var(--border)}
.field textarea{min-height:90px;resize:vertical}
.empty{color:var(--muted);padding:18px 0;line-height:1.9}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:22px;width:min(520px,100%);max-height:88vh;overflow:auto}
.modal h2{font-size:20px;margin:0 0 20px}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.menu-pop{position:fixed;z-index:40;top:70px;right:max(15px,calc((100vw - 1060px)/2));width:min(400px,calc(100vw - 30px));max-height:78vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:10px;display:none;box-shadow:0 18px 55px #0008}
.menu-pop.open{display:block}
.menu-heading{font-weight:bold;padding:12px}
.menu-item{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border)}
.menu-label{flex:1;line-height:1.8;cursor:pointer;overflow-wrap:anywhere}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.swatch{height:48px;border-radius:11px;border:2px solid #ffffff30}
.notice{font-size:12px;color:var(--muted);line-height:1.8;margin-top:8px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.back-btn{margin-bottom:14px}
@media(max-width:520px){.app{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:12px}.page-title{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">✦ پنل مدیریت</div>
  <div class="header-actions">
    <button id="menuAddBtn" class="add-menu-btn" title="افزودن گزینه منو" aria-label="افزودن گزینه منو">+</button>
    <button id="menuBtn" class="icon-btn" title="منو" aria-label="منو">⋯</button>
  </div>
</header>
<main id="main"></main>
</div>
<div id="menuPop" class="menu-pop"></div>
<div id="overlay" class="overlay"><div class="modal"><div id="modalContent"></div></div></div>

<script>
'use strict';

const DB_KEY='shn_user_page_tiles';
const EMPLOYEE_KEY='employeeCodes';
const MENU_KEY='shn_custom_menu_items_v3';
const COLOR_KEY='shn_panel_color_v2';
const PAGE_KEY='shn_custom_pages_v3';
const SUPPORT_KEY='shn_page_media_v1';

const $=s=>document.querySelector(s);
const main=$('#main'),menuPop=$('#menuPop'),overlay=$('#overlay'),modalContent=$('#modalContent');
const menuBtn=$('#menuBtn'),menuAddBtn=$('#menuAddBtn');

function read(key,fallback){
  try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}
  catch{return fallback}
}
function save(key,value){
  try{localStorage.setItem(key,JSON.stringify(value))}
  catch(e){console.warn('ذخیره‌سازی انجام نشد',e)}
}
function uid(){return 'p_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeMenu(){menuPop.classList.remove('open')}
function showModal(html){modalContent.innerHTML=html;overlay.classList.add('open')}
function closeModal(){overlay.classList.remove('open')}
function getTiles(){return read(DB_KEY,[])}
function putTiles(v){save(DB_KEY,v)}
function getPages(){return read(PAGE_KEY,[])}
function putPages(v){save(PAGE_KEY,v)}
function getMenu(){return read(MENU_KEY,[])}
function putMenu(v){save(MENU_KEY,v)}

function applyColor(hex){
  if(!/^#[0-9a-f]{6}$/i.test(hex))hex='#8b5cf6';
  const rgb={r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
  document.documentElement.style.setProperty('--accent',hex);
  document.documentElement.style.setProperty('--soft',`rgba(${rgb.r},${rgb.g},${rgb.b},.15)`);
  save(COLOR_KEY,hex);
}
applyColor(read(COLOR_KEY,'#8b5cf6'));

const colors=[
 ['بنفش','#8b5cf6'],['آبی','#2997ff'],['سبز','#20b981'],['صورتی','#ec4899'],
 ['نارنجی','#f97316'],['قرمز','#ef4444'],['فیروزه‌ای','#14b8a6'],
 ['طلایی','#eab308'],['یاسی','#a78bfa'],['آبی روشن','#38bdf8'],
 ['سبز روشن','#35d399'],['سرمه‌ای','#6366f1'],['صورتی روشن','#f472b6'],
 ['قهوه‌ای','#a16207'],['خاکستری','#94a3b8']
];

const standardMenu=[
 {id:'color',title:'🎨 انتخاب رنگ',kind:'color',target:'',scope:'global'},
 {id:'support-call',title:'تماس با پشتیبانی',kind:'supportCall',target:'',scope:'global'},
 {id:'support-message',title:'پیام به پشتیبانی',kind:'supportMessage',target:'',scope:'global'},
 {id:'exit-user',title:'خروج از صفحه کاربر',kind:'exitUser',target:'',scope:'userChanges'},
 {id:'exit-employee',title:'خروج از صفحه کارمند',kind:'exitEmployee',target:'',scope:'employee'},
 {id:'exit-people',title:'خروج از افراد',kind:'exitPeople',target:'',scope:'people'},
 {id:'exit-panel',title:'خروج از پنل',kind:'exitPanel',target:'',scope:'global'}
];

function ensureMenu(){
  let items=getMenu();
  for(const def of standardMenu){
    if(!items.some(x=>x.id===def.id))items.push({...def});
  }
  putMenu(items);
}
ensureMenu();

let state={
  page:'home',
  currentCustomPage:null,
  activeTab:'user',
  employeeCodes:read(EMPLOYEE_KEY,[])
};

function getCurrentPageId(){
  return state.page==='custom'?state.currentCustomPage:state.page;
}
function pageTitle(){
  if(state.page==='home')return'ورودی';
  if(state.page==='people')return'افراد';
  if(state.page==='userChanges')return'تغییرات صفحه کاربر';
  if(state.page==='employee')return'صفحه کارمند';
  if(state.page==='custom')return getPages().find(p=>p.id===state.currentCustomPage)?.title||'صفحه';
  return'پنل';
}
function pageChain(id){
  const result=[];
  let page=getPages().find(p=>p.id===id),guard=0;
  while(page&&guard++<100){
    result.unshift(page.id);
    page=getPages().find(p=>p.id===page.parentId);
  }
  return result;
}
function currentScope(){
  if(state.page==='custom')return{scope:'custom',parentId:state.currentCustomPage};
  return{scope:state.page,parentId:null};
}
function isVisible(item){
  if(item.scope==='global'||!item.scope)return true;
  if(item.scope==='custom'){
    return state.page==='custom'&&pageChain(state.currentCustomPage).includes(item.parentId);
  }
  return item.scope===state.page;
}
function navigate(page,id=null){
  closeMenu();
  state.page=page;
  state.currentCustomPage=page==='custom'?id:null;
  render();
}
function goHome(){navigate('home')}
function iconFor(type){
  return({card:'▣',button:'🔘',dropdown:'▾',page:'📄',writing:'✍️',audio:'🎙️'})[type]||'▣';
}
function destinations(){
  return[
    ['userChanges','کاربر'],
    ['employee','کارمند'],
    ['home','ورودی'],
    ['newPage','صفحه جدید'],
    ['people','افراد'],
    ...getPages().map(p=>[p.id,p.title])
  ];
}
function targetSelect(selected){
  return `<select name="target" required>${destinations().map(([v,l])=>`<option value="${esc(v)}" ${selected===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
}
function openTarget(target){
  if(target==='newPage'){createPageModal();return}
  if(target==='custom'||getPages().some(p=>p.id===target)){navigate('custom',target);return}
  if(target==='employee'){navigate('employee');return}
  if(target==='people'){state.activeTab='user';navigate('people');return}
  if(target==='user')target='userChanges';
  if(['home','userChanges'].includes(target)){navigate(target);return}
  navigate('home');
}
function render(){
  menuBtn.style.display='flex';
  menuAddBtn.classList.toggle('visible',state.page==='userChanges');
  if(state.page==='home')renderHome();
  else if(state.page==='people')renderPeople();
  else if(state.page==='userChanges')renderUserChanges();
  else if(state.page==='employee')renderEmployee();
  else if(state.page==='custom')renderCustomPage();
}

function tileHTML(t,tools=true){
 return `<article class="tile">
 <div class="tile-main" data-activate="${esc(t.id)}">
 <div class="tile-icon">${esc(t.icon||iconFor(t.type))}</div>
 <div class="tile-title">${esc(t.title)}</div>
 ${t.description?`<div class="tile-description">${esc(t.description)}</div>`:''}
 </div>
 ${tools?`<div class="tile-tools">
 <button class="tool-btn delete-btn" data-delete-tile="${esc(t.id)}" title="حذف">×</button>
 <button class="tool-btn edit-btn" data-edit-tile="${esc(t.id)}" title="ویرایش">✎</button>
 </div>`:''}
 </article>`;
}
function renderHome(){
 const roots=getPages().filter(p=>!p.parentId);
 main.innerHTML=`<h1 class="page-title">ورودی پنل</h1>
 <p class="subtitle">بخش موردنظر را انتخاب کن.</p>
 <div class="grid">
 ${tileHTML({id:'root-user',title:'صفحه کاربر',icon:'👤',action:'userChanges'},false)}
 ${tileHTML({id:'root-people',title:'افراد',icon:'👥',action:'people'},false)}
 ${tileHTML({id:'root-employee',title:'صفحه کارمند',icon:'🧑‍💼',action:'employee'},false)}
 </div>
 <section class="section"><div class="section-heading"><h2>صفحه‌های ساخته‌شده</h2><button class="primary-btn" id="createPageBtn">+ صفحه جدید</button></div>
 <div class="grid">${roots.map(p=>tileHTML({id:p.id,title:p.title,icon:'📄'},false)).join('')||'<div class="empty">هنوز صفحه‌ای ساخته نشده است.</div>'}</div></section>`;
}
function renderUserChanges(){
 const arr=getTiles().filter(t=>t.scope==='userChanges');
 main.innerHTML=`<button class="secondary-btn back-btn" id="backHome">← بازگشت به ورودی</button>
 <h1 class="page-title">تغییرات صفحه کاربر</h1>
 <p class="subtitle">آیتم‌ها را اضافه، ویرایش یا حذف کن.</p>
 <section class="section"><div class="section-heading"><h2>محتوای صفحه کاربر</h2><button class="top-add visible" id="addTileBtn">+ افزودن آیتم</button></div>
 <div class="grid">${arr.map(t=>tileHTML(t)).join('')||'<div class="empty">هنوز آیتمی ساخته نشده است.</div>'}</div></section>`;
}
function renderPeople(){
 main.innerHTML=`<button class="secondary-btn back-btn" id="backHome">← بازگشت به ورودی</button>
 <h1 class="page-title">افراد</h1><p class="subtitle">مدیریت بخش کاربر و کارمند.</p>
 <div class="tabs">
 <button class="tab-btn ${state.activeTab==='user'?'active':''}" data-tab="user">کاربر</button>
 <button class="tab-btn ${state.activeTab==='employee'?'active':''}" data-tab="employee">کارمند</button>
 </div>
 ${state.activeTab==='user'?`<div class="panel"><h2>صفحه کاربر</h2><button class="primary-btn" id="openUserChanges">تغییرات صفحه کاربر</button></div>`:
 `<div class="panel"><div class="section-heading"><h2>کدهای کارمند</h2><button class="primary-btn" id="addEmployeeCode">+ افزودن کد</button></div>
 ${state.employeeCodes.map((c,i)=>`<div class="list-row"><span>${esc(typeof c==='string'?c:c.code||'')}</span><button class="tool-btn delete-btn" data-delete-code="${i}">×</button></div>`).join('')||'<div class="empty">هنوز کدی ثبت نشده است.</div>'}
 <button class="secondary-btn" id="openEmployeePage">ورود به صفحه کارمند</button></div>`}`;
}
function renderEmployee(){
 const arr=getTiles().filter(t=>t.scope==='employee');
 main.innerHTML=`<button class="secondary-btn back-btn" id="backHome">← بازگشت به ورودی</button>
 <h1 class="page-title">صفحه کارمند</h1>
 <p class="subtitle">محتوای مخصوص کارمند در این صفحه نگهداری می‌شود.</p>
 <section class="section"><div class="section-heading"><h2>آیتم‌های کارمند</h2><button class="primary-btn" id="addEmployeeTile">+ افزودن آیتم</button></div>
 <div class="grid">${arr.map(t=>tileHTML(t)).join('')||'<div class="empty">هنوز آیتمی برای کارمند ساخته نشده است.</div>'}</div>
 <div class="panel" style="margin-top:16px"><div class="field"><label>کد کارمند</label><input id="employeeLoginCode" placeholder="کد کارمند را وارد کنید"></div><button class="secondary-btn" id="employeeLogin">بررسی کد</button></div></section>`;
}
function renderCustomPage(){
 const p=getPages().find(x=>x.id===state.currentCustomPage);
 if(!p){goHome();return}
 const children=getPages().filter(x=>x.parentId===p.id);
 const arr=getTiles().filter(t=>t.scope==='custom'&&t.parentId===p.id);
 main.innerHTML=`<button class="secondary-btn back-btn" id="backHome">← بازگشت به ورودی</button>
 <h1 class="page-title">${esc(p.title)}</h1><p class="subtitle">صفحه سفارشی</p>
 <section class="section"><div class="section-heading"><h2>زیرصفحه‌ها</h2><button class="primary-btn" id="addSubPage">+ صفحه جدید</button></div>
 <div class="grid">${children.map(c=>tileHTML({id:c.id,title:c.title,icon:'📄'},false)).join('')||'<div class="empty">زیرصفحه‌ای وجود ندارد.</div>'}</div></section>
 <section class="section"><div class="section-heading"><h2>محتوای صفحه</h2><button class="primary-btn" id="addCustomTile">+ افزودن آیتم</button></div>
 <div class="grid">${arr.map(t=>tileHTML(t)).join('')||'<div class="empty">هنوز آیتمی ساخته نشده است.</div>'}</div></section>`;
}
function createPageModal(prefill='',parentOverride){
 const parent=parentOverride===undefined?(state.page==='custom'?state.currentCustomPage:null):parentOverride;
 showModal(`<h2>ساخت صفحه جدید</h2>
 <div class="field"><label>عنوان صفحه</label><input id="newPageTitle" value="${esc(prefill)}" placeholder="عنوان صفحه" required></div>
 <div class="modal-actions"><button class="primary-btn" id="saveNewPage">ساخت صفحه</button><button class="secondary-btn" data-close>انصراف</button></div>`);
 $('#saveNewPage').onclick=()=>{
  const title=$('#newPageTitle').value.trim();
  if(!title)return alert('عنوان صفحه را وارد کن.');
  const p={id:uid(),title,parentId:parent||null};
  putPages([...getPages(),p]);closeModal();navigate('custom',p.id);
 };
}
function addTileForm(scope,parentId=null){
 showModal(`<h2>افزودن آیتم</h2>
 <div class="field"><label>نوع آیتم</label><select id="newTileType">
 <option value="card">کارت</option><option value="button">دکمه</option><option value="dropdown">منوی کشویی</option><option value="page">صفحه</option><option value="writing">نوشته</option><option value="audio">ضبط صوت</option></select></div>
 <div class="field"><label>ورود به صفحه‌ی...</label>${targetSelect('userChanges')}</div>
 <div class="field"><label>عنوان</label><input id="newTileTitle" required placeholder="عنوان آیتم"></div>
 <div class="field"><label>توضیحات (اختیاری)</label><textarea id="newTileDescription"></textarea></div>
 <div class="modal-actions"><button class="primary-btn" id="saveNewTile">ساخت آیتم</button><button class="secondary-btn" data-close>انصراف</button></div>`);
 $('#saveNewTile').onclick=()=>{
  const title=$('#newTileTitle').value.trim(),type=$('#newTileType').value,target=$('[name="target"]',modalContent).value;
  if(!title)return alert('عنوان را وارد کن.');
  if(type==='page'||target==='newPage'){
   closeModal();createPageModal(title,parentId);return;
  }
  const t={id:uid(),title,type,icon:iconFor(type),target,description:$('#newTileDescription').value.trim(),scope,parentId:scope==='custom'?parentId:null};
  putTiles([...getTiles(),t]);closeModal();render();
 };
}
function editTile(id){
 const t=getTiles().find(x=>x.id===id);if(!t)return;
 showModal(`<h2>ویرایش آیتم</h2>
 <div class="field"><label>ورود به صفحه‌ی...</label>${targetSelect(t.target||'userChanges')}</div>
 <div class="field"><label>عنوان</label><input id="editTileTitle" value="${esc(t.title)}" required></div>
 <div class="field"><label>نوع آیتم</label><select id="editTileType">${[['card','کارت'],['button','دکمه'],['dropdown','منوی کشویی'],['page','صفحه'],['writing','نوشته'],['audio','ضبط صوت']].map(([v,l])=>`<option value="${v}" ${t.type===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="field"><label>توضیحات</label><textarea id="editTileDesc">${esc(t.description||'')}</textarea></div>
 <div class="modal-actions"><button class="primary-btn" id="saveTileEdit">ذخیره</button><button class="secondary-btn" data-close>انصراف</button></div>`);
 $('#saveTileEdit').onclick=()=>{
  const title=$('#editTileTitle').value.trim();if(!title)return alert('عنوان را وارد کن.');
  const target=$('[name="target"]',modalContent).value;
  putTiles(getTiles().map(x=>x.id===id?{...x,title,target,type:$('#editTileType').value,icon:iconFor($('#editTileType').value),description:$('#editTileDesc').value.trim()}:x));
  closeModal();render();
 };
}
function deleteTile(id){
 const t=getTiles().find(x=>x.id===id);if(!t)return;
 if(!confirm(`آیتم «${t.title}» حذف شود؟`))return;
 putTiles(getTiles().filter(x=>x.id!==id));render();
}
function openPalette(){
 showModal(`<h2>🎨 انتخاب رنگ</h2>
 <div class="palette">${colors.map(([n,c])=>`<button class="swatch" style="background:${c}" data-color="${c}" title="${n}"></button>`).join('')}</div>
 <div class="field" style="margin-top:16px"><label>رنگ دلخواه</label><input type="color" id="customColor" value="${esc(read(COLOR_KEY,'#8b5cf6'))}"></div>
 <div class="modal-actions"><button class="primary-btn" id="applyColorBtn">اعمال رنگ</button><button class="secondary-btn" data-close>بستن</button></div>`);
 modalContent.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{applyColor(b.dataset.color);closeModal()});
 $('#applyColorBtn').onclick=()=>{applyColor($('#customColor').value);closeModal()};
}
function addMenuItem(){
 showModal(`<h2>افزودن گزینه منو</h2>
 <div class="field"><label>ورود به صفحه‌ی...</label>${targetSelect('userChanges')}</div>
 <div class="notice">عنوان پیش‌فرض «🎨 انتخاب رنگ» است. بعداً با مداد می‌توانی آن را تغییر بدهی.</div>
 <div class="modal-actions"><button class="primary-btn" id="saveNewMenu">افزودن گزینه</button><button class="secondary-btn" data-close>انصراف</button></div>`);
 $('#saveNewMenu').onclick=()=>{
  const target=$('[name="target"]',modalContent).value;
  if(target==='newPage'){
   closeModal();
   createPageModal('',state.page==='custom'?state.currentCustomPage:null);
   return;
  }
  putMenu([...getMenu(),{id:uid(),title:'🎨 انتخاب رنگ',kind:'custom',target,...currentScope()}]);
  closeModal();renderMenu();
 };
}
function editMenuItem(id){
 const item=getMenu().find(x=>x.id===id);if(!item)return;
 showModal(`<h2>ویرایش گزینه منو</h2>
 <div class="field"><label>ورود به صفحه‌ی...</label>${targetSelect(item.target||'home')}</div>
 <div class="field"><label>عنوان</label><input id="editMenuTitle" value="${esc(item.title)}" required></div>
 <div class="modal-actions"><button class="primary-btn" id="saveMenuEdit">ذخیره</button><button class="secondary-btn" data-close>انصراف</button></div>`);
 $('#saveMenuEdit').onclick=()=>{
  const title=$('#editMenuTitle').value.trim();if(!title)return alert('عنوان را وارد کن.');
  const target=$('[name="target"]',modalContent).value;
  putMenu(getMenu().map(x=>x.id===id?{...x,title,target}:x));
  closeModal();renderMenu();
 };
}
function deleteMenuItem(id){
 const item=getMenu().find(x=>x.id===id);if(!item)return;
 if(!confirm(`گزینه «${item.title}» حذف شود؟`))return;
 putMenu(getMenu().filter(x=>x.id!==id));renderMenu();
}
function renderMenu(){
 const visible=getMenu().filter(isVisible);
 menuPop.innerHTML=`<div class="menu-heading">منو · ${esc(pageTitle())}</div>
 ${visible.map(item=>`<div class="menu-item">
 <div class="menu-label" data-menu-action="${esc(item.id)}">${esc(item.title)}</div>
 <div class="menu-tools">
 <button class="tool-btn delete-btn" data-delete-menu="${esc(item.id)}" title="حذف">×</button>
 <button class="tool-btn edit-btn" data-edit-menu="${esc(item.id)}" title="ویرایش">✎</button>
 </div></div>`).join('')||'<div class="empty">گزینه‌ای برای این صفحه وجود ندارد.</div>'}`;
}
function runMenuItem(item){
 closeMenu();
 if(item.kind==='color'){openPalette();return}
 if(item.kind==='supportCall'){
  showModal(`<h2>تماس با پشتیبانی</h2><div class="field"><label>شماره تماس</label><input id="supportPhone" placeholder="شماره تماس پشتیبانی"></div><div class="modal-actions"><button class="primary-btn" id="callSupport">تماس</button><button class="secondary-btn" data-close>بستن</button></div>`);
  $('#callSupport').onclick=()=>{const n=$('#supportPhone').value.trim();if(!n)return alert('شماره را وارد کن.');location.href='tel:'+n};return;
 }
 if(item.kind==='supportMessage'){
  showModal(`<h2>پیام به پشتیبانی</h2><div class="field"><label>پیام</label><textarea id="supportMessageText" placeholder="پیامت را بنویس"></textarea></div><div class="modal-actions"><button class="primary-btn" id="saveSupportMessage">ذخیره پیام</button><button class="secondary-btn" data-close>بستن</button></div><div class="notice">ارسال واقعی پیام نیاز به اتصال سرویس پشتیبانی دارد.</div>`);
  $('#saveSupportMessage').onclick=()=>{const text=$('#supportMessageText').value.trim();if(!text)return alert('پیام را بنویس.');save(SUPPORT_KEY,{...read(SUPPORT_KEY,{}),supportMessage:text});alert('پیام ذخیره شد.')};return;
 }
 if(item.kind==='exitUser'){navigate('home');return}
 if(item.kind==='exitEmployee'){navigate('people');state.activeTab='employee';renderPeople();return}
 if(item.kind==='exitPeople'){navigate('home');return}
 if(item.kind==='exitPanel'){if(confirm('از پنل خارج شوی و به ورودی برگردی؟'))navigate('home');return}
 openTarget(item.target||'home');
}
function activateTile(id){
 if(id==='root-user'){navigate('userChanges');return}
 if(id==='root-people'){state.activeTab='user';navigate('people');return}
 if(id==='root-employee'){navigate('employee');return}
 const p=getPages().find(x=>x.id===id);
 if(p){navigate('custom',p.id);return}
 const t=getTiles().find(x=>x.id===id);if(!t)return;
 if(t.type==='writing'){
  showModal(`<h2>${esc(t.title)}</h2><p class="subtitle">${esc(t.description||'')}</p><div class="modal-actions"><button class="secondary-btn" data-close>بستن</button></div>`);return;
 }
 if(t.type==='audio'){showAudio(t);return}
 if(t.type==='dropdown'){
  showModal(`<h2>${esc(t.title)}</h2><div class="field"><label>انتخاب مقصد</label>${targetSelect(t.target||'userChanges')}</div><div class="modal-actions"><button class="primary-btn" id="goDropdown">ورود</button><button class="secondary-btn" data-close>بستن</button></div>`);
  $('#goDropdown').onclick=()=>{const target=$('[name="target"]',modalContent).value;closeModal();openTarget(target)};return;
 }
 openTarget(t.target||'userChanges');
}
function showAudio(t){
 showModal(`<h2>${esc(t.title||'ضبط صوت')}</h2><button class="primary-btn" id="startRecording">شروع ضبط</button><button class="secondary-btn" data-close>بستن</button><div id="recordStatus" class="notice"></div><audio id="audioPreview" controls style="display:none;width:100%;margin-top:12px"></audio>`);
 let recorder=null,parts=[],stream=null;
 $('#startRecording').onclick=async()=>{
  if(recorder&&recorder.state==='recording'){recorder.stop();return}
  try{
   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   recorder=new MediaRecorder(stream);parts=[];
   recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
   recorder.onstop=()=>{
    const audio=$('#audioPreview');audio.src=URL.createObjectURL(new Blob(parts,{type:'audio/webm'}));audio.style.display='block';
    $('#recordStatus').textContent='ضبط تمام شد.';
    stream.getTracks().forEach(track=>track.stop());
    $('#startRecording').textContent='ضبط دوباره';
   };
   recorder.start();$('#recordStatus').textContent='در حال ضبط...';$('#startRecording').textContent='پایان ضبط';
  }catch(e){$('#recordStatus').textContent='دسترسی به میکروفون ممکن نیست.'}
 };
}

document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close]');
 if(close){closeModal();return}
 const dm=e.target.closest('[data-delete-menu]');
 if(dm){e.stopPropagation();deleteMenuItem(dm.dataset.deleteMenu);return}
 const em=e.target.closest('[data-edit-menu]');
 if(em){e.stopPropagation();editMenuItem(em.dataset.editMenu);return}
 const ma=e.target.closest('[data-menu-action]');
 if(ma){const item=getMenu().find(x=>x.id===ma.dataset.menuAction);if(item)runMenuItem(item);return}
 const dt=e.target.closest('[data-delete-tile]');
 if(dt){e.stopPropagation();deleteTile(dt.dataset.deleteTile);return}
 const et=e.target.closest('[data-edit-tile]');
 if(et){e.stopPropagation();editTile(et.dataset.editTile);return}
 const ac=e.target.closest('[data-activate]');
 if(ac){activateTile(ac.dataset.activate);return}
 if(e.target.closest('#backHome')){goHome();return}
 if(e.target.closest('#createPageBtn')){createPageModal();return}
 if(e.target.closest('#addTileBtn')){addTileForm('userChanges');return}
 if(e.target.closest('#addEmployeeTile')){addTileForm('employee');return}
 if(e.target.closest('#addCustomTile')){addTileForm('custom',state.currentCustomPage);return}
 if(e.target.closest('#addSubPage')){createPageModal('',state.currentCustomPage);return}
 if(e.target.closest('#openUserChanges')){navigate('userChanges');return}
 if(e.target.closest('#openEmployeePage')){navigate('employee');return}
 const tab=e.target.closest('[data-tab]');
 if(tab){state.activeTab=tab.dataset.tab;renderPeople();return}
 if(e.target.closest('#addEmployeeCode')){
  showModal(`<h2>افزودن کد کارمند</h2><div class="field"><label>کد کارمند</label><input id="newEmployeeCode" required></div><div class="modal-actions"><button class="primary-btn" id="saveEmployeeCode">ذخیره</button><button class="secondary-btn" data-close>انصراف</button></div>`);
  $('#saveEmployeeCode').onclick=()=>{
   const code=$('#newEmployeeCode').value.trim();if(!code)return alert('کد را وارد کن.');
   state.employeeCodes.push(code);save(EMPLOYEE_KEY,state.employeeCodes);closeModal();renderPeople();
  };return;
 }
 const dc=e.target.closest('[data-delete-code]');
 if(dc){if(!confirm('این کد حذف شود؟'))return;state.employeeCodes.splice(Number(dc.dataset.deleteCode),1);save(EMPLOYEE_KEY,state.employeeCodes);renderPeople();return}
 if(e.target.closest('#employeeLogin')){
  const code=$('#employeeLoginCode').value.trim();
  alert(state.employeeCodes.some(c=>(typeof c==='string'?c:c.code)===code)?'کد کارمند تأیید شد.':'کد کارمند ثبت نشده است.');
 }
});

menuBtn.addEventListener('click',()=>{
 renderMenu();
 menuPop.classList.toggle('open');
});
menuAddBtn.addEventListener('click',()=>{
 closeMenu();addMenuItem();
});
document.addEventListener('click',e=>{
 if(!menuPop.contains(e.target)&&!menuBtn.contains(e.target)&&!menuAddBtn.contains(e.target))closeMenu();
});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});

render();
</script>
</body>
</html>
