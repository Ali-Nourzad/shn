<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>س.ح.ن</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">س.ح.ن</div>
        <button class="menu-button"><span></span><span></span><span></span></button>
    </nav>

    <!-- در بخش کارت‌ها، دکمه‌ها را به این شکل اصلاح کنید -->
    <div class="selection-container">
        <!-- کارت کارمند -->
        <div class="employee-card">
            <h2>کارمند</h2>
            <p>دسترسی به پنل مدیریت</p>
            <button class="select-btn" onclick="openModal('login', 'employee')">ورود</button>
        </div>

        <!-- کارت کاربر -->
        <div class="user-card">
            <h2>کاربر</h2>
            <p>خرید و مشاهده خدمات</p>
            <button class="select-btn" onclick="openModal('login', 'user')">ورود</button>
            <!-- دکمه ثبت نام فقط برای کاربر است
            <button class="switch-btn" onclick="openModal('register', 'user')">ثبت‌نام کاربر جدید</button> -->
        </div>
    </div>

    <div id="registration-section" class="registration-section">
        <div class="registration-form">
            <button class="close-btn" onclick="hideForm()">&times;</button>
            <h2 id="form-title">فرم</h2>
            <form id="auth-form"></form>
            <button id="switch-mode-btn" class="switch-btn" onclick="toggleMode()"></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
