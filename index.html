<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>س.ح.ن</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: "Lalezar";
            src: url("./Lalezar-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #f5f1e8;
            --surface: rgba(255,252,245,.82);
            --surface-solid: #fffdf8;
            --text: #292722;
            --muted: #777268;
            --accent: #d77b32;
            --accent-dark: #a9531c;
            --dark: #292824;
            --border: rgba(67,58,47,.12);
            --shadow: 0 20px 50px rgba(54,44,31,.10);
            --danger: #c94b43;
            --success: #4f8055;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 8% 10%, rgba(215,123,50,.11), transparent 28%),
                radial-gradient(circle at 92% 18%, rgba(255,185,0,.09), transparent 28%),
                var(--bg);
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            border: none;
        }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 82px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,252,245,.82);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(54,44,31,.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .brand {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 32px;
        }

        .menu-btn {
            width: 56px;
            height: 56px;
            border-radius: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: linear-gradient(145deg,#3f3a34,#211f1c);
            box-shadow:
                0 8px 20px rgba(45,35,25,.20),
                inset 0 1px 1px rgba(255,255,255,.16);
            cursor: pointer;
        }

        .menu-btn span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #fffdf8;
        }

        /* MENU */
        .dropdown {
            position: fixed;
            top: 94px;
            left: 6%;
            width: 245px;
            padding: 10px;
            z-index: 1200;
            background: rgba(255,252,245,.96);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: .22s;
        }

        .dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown button {
            width: 100%;
            padding: 14px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 13px;
            text-align: right;
        }

        .dropdown button:hover {
            background: #f1eade;
        }

        /* HERO */
        .hero {
            min-height: calc(100vh - 82px);
            padding: 70px 6%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-inner {
            width: min(1000px,100%);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(215,123,50,.10);
            color: var(--accent-dark);
            border: 1px solid rgba(215,123,50,.16);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: clamp(45px,7vw,78px);
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .hero > .hero-inner > p {
            max-width: 600px;
            margin: 0 auto 45px;
            color: var(--muted);
            line-height: 2;
            font-size: 15px;
        }

        /* MAIN TWO CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0,1fr));
            gap: 24px;
            max-width: 800px;
            margin: auto;
        }

        .card {
            min-height: 240px;
            padding: 30px;
            border-radius: 28px;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .25s;
        }

        .card:hover {
            transform: translateY(-7px);
            box-shadow: 0 28px 55px rgba(54,44,31,.14);
        }

        .card-icon {
            width: 76px;
            height: 76px;
            border-radius: 23px;
            display: grid;
            place-items: center;
            background: #f1e8dc;
            font-size: 34px;
            margin-bottom: 18px;
        }

        .card h2 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .card p {
            color: var(--muted);
            line-height: 1.9;
            font-size: 13px;
        }

        /* OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(28,25,21,.48);
            backdrop-filter: blur(7px);
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            width: min(470px,100%);
            max-height: 92vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 28px;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            box-shadow: 0 35px 90px rgba(35,28,20,.24);
            transform: translateY(18px) scale(.98);
            transition: .25s;
        }

        .overlay.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-family: "Lalezar", Tahoma, sans-serif;
            font-size: 30px;
        }

        .close-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: #eee7dd;
            color: var(--text);
            cursor: pointer;
            font-size: 21px;
        }

        /* USER TABS */
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 5px;
            margin-bottom: 20px;
            background: #f0e9df;
            border-radius: 15px;
        }

        .tab {
            padding: 11px;
            border-radius: 11px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
        }

        .tab.active {
            color: var(--text);
            background: var(--surface-solid);
            box-shadow: 0 3px 10px rgba(54,44,31,.07);
        }

        /* FORMS */
        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #fffefa;
            color: var(--text);
            outline: none;
            font-size: 13px;
        }

        .field input:focus {
            border-color: rgba(215,123,50,.55);
            box-shadow: 0 0 0 4px rgba(215,123,50,.09);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-left: 48px;
        }

        .eye {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            height: 50px;
            margin-top: 5px;
            border-radius: 15px;
            background: linear-gradient(135deg,var(--accent),#e28f42);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 12px 24px rgba(215,123,50,.20);
        }

        .message {
            min-height: 23px;
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            line-height: 1.8;
        }

        .error {
            color: var(--danger);
        }

        .success {
            color: var(--success);
        }

        /* SUPPORT */
        .support-description {
            color: var(--muted);
            line-height: 2;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .support-number {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 16px;
            background: #f4ede4;
            border: 1px solid var(--border);
        }

        .support-number strong {
            direction: ltr;
            unicode-bidi: plaintext;
        }

        .support-number a {
            text-decoration: none;
            background: var(--dark);
            color: white;
            border-radius: 11px;
            padding: 9px 14px;
            font-size: 12px;
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {

            .navbar {
                height: 74px;
                padding: 0 20px;
            }

            .menu-btn {
                width: 50px;
                height: 50px;
            }

            .dropdown {
                top: 84px;
                left: 20px;
                right: 20px;
                width: auto;
            }

            .hero {
                padding: 45px 20px;
            }

            .modal {
                padding: 22px;
                border-radius: 23px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="brand">
        س.ح.ن
    </div>

    <button class="menu-btn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>

<!-- MENU -->
<div class="dropdown" id="dropdownMenu">

    <button onclick="openSupport()">
        ☎ تماس با پشتیبانی
    </button>

    <button onclick="openSupport()">
        ✉ پیام به پشتیبانی
    </button>

</div>

<!-- HOME -->
<main class="hero">

    <div class="hero-inner">

        <div class="badge">
            ✦ به دنیای س.ح.ن خوش آمدید
        </div>

        <h1>
            س.ح.ن
        </h1>

        <p>
            بخش موردنظر خود را انتخاب کنید.
        </p>

        <div class="cards">

            <!-- کاربر -->
            <div class="card" onclick="openUserAuth()">

                <div class="card-icon">
                    👤
                </div>

                <h2>
                    کاربر
                </h2>

                <p>
                    ورود یا ساخت حساب کاربری
                </p>

            </div>

            <!-- کارمند -->
            <div class="card" onclick="openEmployeeAuth()">

                <div class="card-icon">
                    💼
                </div>

                <h2>
                    کارمند
                </h2>

                <p>
                    ورود به پنل کارمند
                </p>

            </div>

        </div>

    </div>

</main>

<!-- ========================= -->
<!-- USER MODAL -->
<!-- ========================= -->

<div class="overlay" id="userOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                کاربر
            </h2>

            <button
                class="close-btn"
                onclick="closeUserAuth()">
                ×
            </button>

        </div>

        <!-- فقط دو گزینه برای کاربر -->
        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="switchUserTab('login')">
                حساب دارم
            </button>

            <button
                class="tab"
                id="signupTab"
                onclick="switchUserTab('signup')">
                حساب ندارم
            </button>

        </div>

        <!-- ========================= -->
        <!-- حساب دارم -->
        <!-- فقط ایمیل + رمز -->
        <!-- ========================= -->

        <form
            class="form active"
            id="loginForm">

            <div class="field">

                <label>
                    ایمیل
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label>
                    رمز عبور
                </label>

                <div class="password-wrap">

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('loginPassword',this)">
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit-btn">
                ورود
            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </form>

        <!-- ========================= -->
        <!-- حساب ندارم -->
        <!-- اطلاعات بیشتر -->
        <!-- ========================= -->

        <form
            class="form"
            id="signupForm">

            <div class="field">

                <label>
                    نام
                </label>

                <input
                    id="signupFirstName"
                    type="text"
                    placeholder="نام"
                    autocomplete="given-name"
                    required
                >

            </div>

            <div class="field">

                <label>
                    نام خانوادگی
                </label>

                <input
                    id="signupLastName"
                    type="text"
                    placeholder="نام خانوادگی"
                    autocomplete="family-name"
                    required
                >

            </div>

            <div class="field">

                <label>
                    شماره تلفن
                </label>

                <input
                    id="signupPhone"
                    type="tel"
                    placeholder="0912..."
                    autocomplete="tel"
                    required
                >

            </div>

            <div class="field">

                <label>
                    ایمیل
                </label>

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="example@gmail.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label>
                    رمز عبور
                </label>

                <div class="password-wrap">

                    <input
                        id="signupPassword"
                        type="password"
                        placeholder="رمز عبور"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('signupPassword',this)">
                        ◉
                    </button>

                </div>

            </div>

            <div class="field">

                <label>
                    تکرار رمز عبور
                </label>

                <div class="password-wrap">

                    <input
                        id="signupPasswordRepeat"
                        type="password"
                        placeholder="تکرار رمز عبور"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('signupPasswordRepeat',this)">
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit-btn">
                ساخت حساب
            </button>

            <div
                id="signupMessage"
                class="message">
            </div>

        </form>

    </div>

</div>

<!-- ========================= -->
<!-- EMPLOYEE MODAL -->
<!-- فقط کد کارمند -->
<!-- ========================= -->

<div class="overlay" id="employeeOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                کارمند
            </h2>

            <button
                class="close-btn"
                onclick="closeEmployeeAuth()">
                ×
            </button>

        </div>

        <form id="employeeForm">

            <div class="field">

                <label>
                    کد کارمند
                </label>

                <div class="password-wrap">

                    <input
                        id="employeeCode"
                        type="password"
                        placeholder="کد کارمند"
                        autocomplete="off"
                        required
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('employeeCode',this)">
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit-btn">
                ورود
            </button>

            <div
                id="employeeMessage"
                class="message">
            </div>

        </form>

    </div>

</div>

<!-- SUPPORT -->
<div class="overlay" id="supportOverlay">

    <div class="modal">

        <div class="modal-header">

            <h2>
                پشتیبانی
            </h2>

            <button
                class="close-btn"
                onclick="closeSupport()">
                ×
            </button>

        </div>

        <p class="support-description">
            برای تماس با پشتیبانی می‌توانید از شماره‌های زیر استفاده کنید.
        </p>

        <div class="support-number">

            <strong>
                09122162177
            </strong>

            <a href="tel:09122162177">
                تماس
            </a>

        </div>

        <div class="support-number">

            <strong>
                09122940829
            </strong>

            <a href="tel:09122940829">
                تماس
            </a>

        </div>

    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://zyziyyhzxsnwzrsubulu.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_RIGsFvG_eSFBmXYAxe8UHA_JQjhVkpR";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    /* =========================
       MENU
       ========================= */

    const menuBtn =
        document.getElementById("menuBtn");

    const dropdownMenu =
        document.getElementById("dropdownMenu");

    menuBtn.addEventListener("click", event => {

        event.stopPropagation();

        dropdownMenu.classList.toggle("open");

    });

    document.addEventListener("click", event => {

        if (
            !dropdownMenu.contains(event.target) &&
            !menuBtn.contains(event.target)
        ) {

            dropdownMenu.classList.remove("open");

        }

    });

    /* =========================
       USER
       ========================= */

    function openUserAuth() {

        document
            .getElementById("userOverlay")
            .classList.add("open");

        switchUserTab("login");

    }

    function closeUserAuth() {

        document
            .getElementById("userOverlay")
            .classList.remove("open");

        clearMessages();

    }

    function switchUserTab(type) {

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        if (type === "login") {

            loginForm.classList.add("active");
            signupForm.classList.remove("active");

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

        } else {

            loginForm.classList.remove("active");
            signupForm.classList.add("active");

            loginTab.classList.remove("active");
            signupTab.classList.add("active");

        }

        clearMessages();

    }

    /* =========================
       USER LOGIN
       ========================= */

    document
        .getElementById("loginForm")
        .addEventListener("submit", async event => {

            event.preventDefault();

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("loginPassword")
                    .value;

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email,
                        password
                    });

            if (error) {

                showMessage(
                    "loginMessage",
                    "ایمیل یا رمز عبور اشتباه است."
                );

                return;

            }

            if (!data.session) {

                showMessage(
                    "loginMessage",
                    "ورود انجام نشد."
                );

                return;

            }

            window.location.href =
                "user-dashboard.html";

        });

    /* =========================
       USER SIGNUP
       ========================= */

    document
        .getElementById("signupForm")
        .addEventListener("submit", async event => {

            event.preventDefault();

            const firstName =
                document
                    .getElementById("signupFirstName")
                    .value
                    .trim();

            const lastName =
                document
                    .getElementById("signupLastName")
                    .value
                    .trim();

            const phone =
                document
                    .getElementById("signupPhone")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("signupEmail")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("signupPassword")
                    .value;

            const repeatPassword =
                document
                    .getElementById("signupPasswordRepeat")
                    .value;

            if (
                !firstName ||
                !lastName ||
                !phone ||
                !email ||
                !password ||
                !repeatPassword
            ) {

                showMessage(
                    "signupMessage",
                    "لطفاً همه اطلاعات را وارد کنید."
                );

                return;

            }

            if (
                password !== repeatPassword
            ) {

                showMessage(
                    "signupMessage",
                    "رمز عبور و تکرار آن یکسان نیست."
                );

                return;

            }

            if (password.length < 6) {

                showMessage(
                    "signupMessage",
                    "رمز عبور باید حداقل ۶ کاراکتر باشد."
                );

                return;

            }

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signUp({

                        email,

                        password,

                        options: {

                            data: {

                                first_name:
                                    firstName,

                                last_name:
                                    lastName,

                                phone:
                                    phone

                            }

                        }

                    });

            if (error) {

                showMessage(
                    "signupMessage",
                    error.message
                );

                return;

            }

            if (!data.user) {

                showMessage(
                    "signupMessage",
                    "ساخت حساب انجام نشد."
                );

                return;

            }

            if (!data.session) {

                showMessage(
                    "signupMessage",
                    "حساب ساخته شد، اما ورود خودکار فعال نیست.",
                    "success"
                );

                return;

            }

            showMessage(
                "signupMessage",
                "حساب با موفقیت ساخته شد.",
                "success"
            );

            setTimeout(() => {

                window.location.href =
                    "user-dashboard.html";

            }, 500);

        });

    /* =========================
       EMPLOYEE
       ========================= */

    function openEmployeeAuth() {

        document
            .getElementById("employeeOverlay")
            .classList.add("open");

        document
            .getElementById("employeeCode")
            .value = "";

        document
            .getElementById("employeeMessage")
            .textContent = "";

    }

    function closeEmployeeAuth() {

        document
            .getElementById("employeeOverlay")
            .classList.remove("open");

    }

    document
        .getElementById("employeeForm")
        .addEventListener("submit", async event => {

            event.preventDefault();

            const code =
                document
                    .getElementById("employeeCode")
                    .value;

            const {
                error: signInError
            } =
                await supabaseClient.auth
                    .signInAnonymously();

            if (signInError) {

                showMessage(
                    "employeeMessage",
                    "ورود کارمند فعال نیست."
                );

                return;

            }

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "authorize_employee",
                    {
                        p_code: code
                    }
                );

            if (
                error ||
                data !== true
            ) {

                await supabaseClient.auth.signOut();

                showMessage(
                    "employeeMessage",
                    "کد کارمند اشتباه است."
                );

                return;

            }

            window.location.href =
                "employee_dashboard.html";

        });

    /* =========================
       SUPPORT
       ========================= */

    function openSupport() {

        dropdownMenu.classList.remove("open");

        document
            .getElementById("supportOverlay")
            .classList.add("open");

    }

    function closeSupport() {

        document
            .getElementById("supportOverlay")
            .classList.remove("open");

    }

    /* =========================
       PASSWORD
       ========================= */

    function togglePassword(id, button) {

        const input =
            document.getElementById(id);

        input.type =
            input.type === "password"
                ? "text"
                : "password";

    }

    /* =========================
       MESSAGES
       ========================= */

    function showMessage(id, text, type = "error") {

        const element =
            document.getElementById(id);

        element.textContent = text;

        element.className =
            "message " + type;

    }

    function clearMessages() {

        document
            .querySelectorAll(".message")
            .forEach(element => {

                element.textContent = "";

                element.className = "message";

            });

    }

    /* =========================
       CLOSE BY CLICK OUTSIDE
       ========================= */

    document
        .getElementById("userOverlay")
        .addEventListener("click", event => {

            if (
                event.target.id === "userOverlay"
            ) {

                closeUserAuth();

            }

        });

    document
        .getElementById("employeeOverlay")
        .addEventListener("click", event => {

            if (
                event.target.id === "employeeOverlay"
            ) {

                closeEmployeeAuth();

            }

        });

    document
        .getElementById("supportOverlay")
        .addEventListener("click", event => {

            if (
                event.target.id === "supportOverlay"
            ) {

                closeSupport();

            }

        });

</script>
